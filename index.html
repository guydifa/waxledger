<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Beaker Lab</title>
<style>
@font-face{font-family:"Bricolage Grotesque";src:url("fonts/bricolage-grotesque-latin-600-normal.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Bricolage Grotesque";src:url("fonts/bricolage-grotesque-latin-800-normal.woff2") format("woff2");font-weight:800;font-style:normal;font-display:swap}
@font-face{font-family:"Figtree";src:url("fonts/figtree-latin-400-normal.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Figtree";src:url("fonts/figtree-latin-500-normal.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Figtree";src:url("fonts/figtree-latin-600-normal.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Figtree";src:url("fonts/figtree-latin-700-normal.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url("fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url("fonts/jetbrains-mono-latin-700-normal.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
img{max-width:100%}

/* ---- home hub: one screen, Play in thumb reach, features behind side icons ---- */
.home.hub{min-height:calc(100dvh - 28px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); gap:10px}
.hub-hero{display:flex; flex-direction:column; align-items:center; gap:2px}
.hub-hero h1{margin:4px 0 0; text-align:center}
.hub-hero .equation{margin:-14px 0 -8px}
.hub-mid{flex:1; display:grid; grid-template-columns:84px 1fr 84px; gap:4px; align-items:center}
.rail{display:grid; grid-template-rows:repeat(3, 104px); gap:6px; justify-items:center; align-content:center; align-self:stretch}   /* fixed slots: icons line up across both sides */
.rail .hub-ico{height:104px; justify-content:flex-start}
.hub-ico{position:relative; width:82px; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:0; padding:0; color:var(--ink); font:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
.hub-ico i{font-style:normal; width:62px; height:62px; border-radius:20px; display:grid; place-items:center; font-size:34px; background:var(--panel); border:1px solid var(--line); box-shadow:0 3px 0 var(--line), 0 6px 14px rgba(0,0,0,.08); transition:transform .12s}
.hub-ico:active i{transform:translateY(2px) scale(.96)}
.hub-ico span{font-size:15px; font-weight:700; line-height:1.1; text-align:center; color:var(--muted)}
.hub-ico em{font-style:normal; font-size:13px; font-weight:800; padding:1px 8px; border-radius:999px; background:color-mix(in srgb, var(--accent) 14%, transparent); color:var(--accent); white-space:nowrap; font-variant-numeric:tabular-nums}
.hub-ico em:empty{display:none}
.hub-ico.has-dot i::after{content:""; position:absolute; top:-3px; right:2px; width:16px; height:16px; border-radius:50%; background:#ff3b30; border:2px solid var(--paper); animation:hub-dot 1.6s ease-in-out infinite}
.hub-ico.hot i{background:linear-gradient(180deg,#ffd35a,#ff9a1a); border-color:#f08a00}
.hub-ico.hot em{background:color-mix(in srgb, #ff3b30 14%, transparent); color:#e0301f}
.hub-ico.ev i{background:color-mix(in srgb, var(--accent) 16%, var(--panel))}
@keyframes hub-dot{0%,100%{transform:scale(1)} 50%{transform:scale(1.18)}}
.hub-level{display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; align-self:start; margin-top:2px}   /* sits just under the beakers */
.hub-level .eyebrow{font-size:18px; font-weight:800; letter-spacing:.12em; color:var(--accent)}
.hub-lvl{font-family:var(--display); font-weight:800; font-size:44px; line-height:1; letter-spacing:-.02em}
.hub-level .progress{width:100%}
.hub-links{display:flex; gap:10px; align-items:center; font-size:16px}
.hub-stars{font-weight:700}
.hub-gift{font-size:14px; font-weight:600; color:var(--muted)}
.hub-bottom{display:flex; flex-direction:column; gap:10px; padding-bottom:4px}
.hub-tiles{display:grid; grid-template-columns:1fr 1fr 64px; gap:8px}
.hub-tile{position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:2px; padding:10px 12px; border-radius:16px; background:var(--panel); border:1px solid var(--line); box-shadow:0 3px 0 var(--line); color:var(--ink); font:inherit; text-align:left; cursor:pointer}
.hub-tile i{font-style:normal; font-size:22px}
.hub-tile span{font-size:15.5px; font-weight:700; line-height:1.15}
.hub-tile b{position:absolute; top:9px; right:10px; font-size:15px; font-weight:800; color:var(--accent)}
.hub-tile.done{opacity:.7}
.hub-tile[data-drawer]{align-items:center; justify-content:center}
.hub-tile.has-dot::after{content:""; position:absolute; top:6px; right:8px; width:12px; height:12px; border-radius:50%; background:#ff3b30}
.btn.play-big.fizzy{position:relative; background:none; box-shadow:0 10px 24px rgba(31,157,69,.28); border-radius:999px; overflow:hidden; text-shadow:0 1px 2px rgba(0,60,20,.55), 0 0 8px rgba(0,60,20,.25)}
.btn.play-big.fizzy > *:not(canvas){position:relative}
.btn.play-big.fizzy{padding:20px 16px 12px; flex-direction:column-reverse; line-height:1.05}   /* big level first, CONTINUE underneath, both below the glass highlights */
.btn.play-big.fizzy small{font-size:15px; font-weight:800; opacity:1; text-shadow:0 1px 2px rgba(0,50,15,.8), 0 0 6px rgba(0,50,15,.45)}   /* sits below the glass highlights */
.btn.play-big.fizzy:active{transform:translateY(2px) scale(.99); box-shadow:0 6px 14px rgba(31,157,69,.25)}
.fz-cv{position:absolute; inset:0; width:100%; height:100%}
.btn.play-big{display:flex; flex-direction:column; align-items:center; gap:0; font-size:30px; font-weight:800; padding:14px 16px 16px; border-radius:22px; background:linear-gradient(180deg,#34c759,#1f9d45); color:#fff; border:0; box-shadow:0 5px 0 #17803a, 0 12px 26px rgba(31,157,69,.35); animation:hub-go 2.2s 1s ease-in-out infinite}
.btn.play-big small{font-size:14px; font-weight:700; opacity:.9; text-transform:uppercase; letter-spacing:.08em}
.btn.play-big:active{transform:translateY(3px); box-shadow:0 2px 0 #17803a}
@keyframes hub-go{0%,100%{transform:scale(1)} 50%{transform:scale(1.025)}}
.om-stake{background:color-mix(in srgb, #ff7a18 11%, transparent); border-radius:12px; padding:10px 12px; text-align:left}
.om-stake b{display:block; font-size:15px; margin-bottom:4px}
.om-stake ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:3px; font-size:15px; font-weight:600}
.progress.lb, .rbar.lb{height:18px; background:none; overflow:visible; position:relative; border-radius:0}
.rbar.lb{height:15px}
.hub-level .progress.lb{height:22px; width:92%}
.lb > i{display:none !important}
.lb-cv{display:block; width:100%; height:100%}
.hub-map, .chalk{position:relative; width:100%; max-width:220px; height:92px; box-sizing:border-box; border-radius:16px; border:1px solid color-mix(in srgb, var(--line) 80%, transparent);
  background-color:color-mix(in srgb, var(--paper) 88%, #1e2a3b); background-image:linear-gradient(color-mix(in srgb, var(--grid) 85%, var(--ink)) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--grid) 85%, var(--ink)) 1px, transparent 1px);
  background-size:12px 12px; background-position:-1px -1px; box-shadow:inset 0 1px 3px rgba(20,30,50,.08); color:var(--ink)}   /* a shade darker than the page (lighter in dark mode) */
.hub-map{padding:0; overflow:hidden; cursor:pointer}
.hub-map:active{transform:translateY(2px)}
.hub-map canvas{display:block; width:100%; height:100%}
.hub-map-tag{position:absolute; left:10px; top:7px; display:flex; gap:8px; align-items:center; font-size:14.5px; font-weight:800; color:inherit}
.hub-map-tag b{font-weight:800}
.chalk{display:grid; place-items:center; padding:10px 14px; text-align:center; font-size:16px; font-weight:700; line-height:1.3}
.chalk span{transition:opacity .38s ease, transform .38s ease}
.chalk span.out{opacity:0; transform:translateY(-4px)}
:root[data-theme="dark"] .hub-map, :root[data-theme="dark"] .chalk{background-color:color-mix(in srgb, var(--paper) 90%, #ffffff); background-image:linear-gradient(color-mix(in srgb, var(--grid) 80%, #ffffff) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--grid) 80%, #ffffff) 1px, transparent 1px)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .hub-map, :root:not([data-theme="light"]) .chalk{background-color:color-mix(in srgb, var(--paper) 90%, #ffffff); background-image:linear-gradient(color-mix(in srgb, var(--grid) 80%, #ffffff) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--grid) 80%, #ffffff) 1px, transparent 1px)} }
.hub-map-tag b{color:#c98a00}
.hub-hard{margin-top:-4px; font-size:14px; font-weight:800; padding:3px 10px; border-radius:999px; color:#fff; background:linear-gradient(90deg,#ff5a36,#ff2d55)}
.hub-hard.super{background:linear-gradient(90deg,#8e2de2,#ff2d95)}
.offer-card .of-what{font-size:16px; font-weight:600; color:var(--ink)}
.of-save{align-self:center; font-size:13px; font-weight:800; color:#fff; background:#ff3b30; padding:2px 10px; border-radius:999px}
.placard.offer-pop{max-width:340px}
.placard.offer-pop .card{border:0; background:none; padding:4px 0 0}
.hub-sheet .card-top, .offer-pop .card-top{padding-right:34px}
.hub-scrim{opacity:0; transition:opacity .22s ease}
.hub-scrim.on{opacity:1}
.hub-scrim .hub-sheet{position:relative; max-height:calc(100dvh - 90px); overflow-y:auto; padding:16px 12px 12px; gap:10px; transform:translateY(30px); transition:transform .3s cubic-bezier(.2,.9,.25,1)}
.hub-scrim.on .hub-sheet{transform:none}
.hub-sheet .drawer{display:flex; flex-direction:column; gap:12px}
.hub-sheet .card{border:0; padding:6px 4px 0; background:none}
.hub-sheet .sh-x{position:absolute; top:8px; right:10px; z-index:2}
@media (max-height:760px){ .hub-ico i{width:54px; height:54px; font-size:30px; border-radius:18px} .rail{grid-template-rows:repeat(3, 82px); gap:2px} .rail .hub-ico{height:82px} .hub-ico span{font-size:13.5px} .hub-tile span{font-size:14px} .hub-hero h1{font-size:34px} .hub-lvl{font-size:36px} .btn.play-big{font-size:26px; padding:10px 16px 12px} .hub-tile{padding:6px 10px} .hub-map, .chalk{height:64px} .chalk{padding:4px 8px; font-size:14px} .hub-level{gap:5px} .home.hub{gap:6px} .hub-hero .equation{margin:-18px 0 -12px} }
@media (prefers-reduced-motion: reduce){ .btn.play-big, .hub-ico.has-dot i::after{animation:none} }
</style>
<style>
:root{
  --paper:#EDF2F6; --grid:#D3DEE8; --panel:#F8FAFC; --bench:#DDE6EE; --ink:#13233A; --muted:#546479; --line:#C3D0DC;
  --accent:#2952C4; --on-accent:#FFFFFF; --glass:#8FA6BE; --shadow:rgba(19,35,58,.16);
  --c0:#F0102C; --c1:#FFC800; --c2:#0A66FF; --c3:#FF6A00; --c4:#00B84C; --c5:#8A1CF2;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --ui:"Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0B1320; --grid:#16243B; --panel:#111C2D; --bench:#16233A; --ink:#E4ECF7; --muted:#8FA0B8; --line:#243349;
    --accent:#86A8FF; --on-accent:#0B1320; --glass:#7D93B3; --shadow:rgba(0,0,0,.5);
    --c0:#FF3A52; --c1:#FFD21A; --c2:#3C8CFF; --c3:#FF8A12; --c4:#1FE67E; --c5:#B45CFF;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0B1320; --grid:#16243B; --panel:#111C2D; --bench:#16233A; --ink:#E4ECF7; --muted:#8FA0B8; --line:#243349;
  --accent:#86A8FF; --on-accent:#0B1320; --glass:#7D93B3; --shadow:rgba(0,0,0,.5);
  --c0:#FF3A52; --c1:#FFD21A; --c2:#3C8CFF; --c3:#FF8A12; --c4:#1FE67E; --c5:#B45CFF;
}
html,body{height:100%}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font-family:var(--ui); font-size:17px; line-height:1.45;
  -webkit-tap-highlight-color:transparent;
}
.app{max-width:520px; margin:0 auto; padding-inline:16px; padding-block:12px 20px; height:100%; min-height:560px; display:flex; flex-direction:column; gap:12px; box-sizing:border-box}
.app.scroll{height:auto; min-height:100%}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible{outline:2px solid var(--accent); outline-offset:3px}

/* ---------- Home ---------- */
.home{display:flex; flex-direction:column; gap:14px}
.brand{display:flex; flex-direction:column; gap:6px; padding-top:8px}
.brand-top{display:flex; justify-content:space-between; align-items:center}
.pill{font-family:var(--mono); font-size:13px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); border:1px solid color-mix(in srgb, var(--accent) 50%, transparent); border-radius:999px; padding:3px 9px}
h1{font-family:var(--display); font-weight:800; font-size:48px; line-height:.98; margin:6px 0 0; letter-spacing:-.025em; text-wrap:balance}
.lede{margin:0; color:var(--muted); font-size:18px; max-width:34ch}
.equation{display:flex; align-items:flex-end; gap:6px; margin-top:4px}
.equation canvas{display:block}
.equation .op{font-family:var(--mono); font-weight:700; font-size:20px; color:var(--muted); padding-bottom:30px}
.card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:10px}
.card-top{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
.eyebrow{font-family:var(--mono); font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.card h2{font-family:var(--display); font-weight:600; font-size:24px; margin:0; line-height:1.15; letter-spacing:-.01em}
.meta{color:var(--muted); font-size:16px; margin:0}
.streak{font-family:var(--mono); font-size:14px; font-weight:700; color:var(--accent); white-space:nowrap}
.btn{border:0; border-radius:12px; padding:13px 16px; font-weight:700; font-size:18px; background:var(--ink); color:var(--paper); text-align:center}
.btn.accent{background:var(--accent); color:var(--on-accent)}
.btn.ghost{background:transparent; border:1px solid var(--line); color:var(--ink)}
.btn:active{transform:translateY(1px)}
/* App Store style: iOS system blue capsule with white text */
.btn.store, .btn[data-buy], #p-buy, #up-buy, #or-buy, #w-keep{background:#007AFF; color:#fff; border:0; border-radius:999px}
@media (prefers-color-scheme: dark){ .btn.store, .btn[data-buy], #p-buy, #up-buy, #or-buy, #w-keep{background:#0A84FF} }
:root[data-theme="dark"] :is(.btn.store, .btn[data-buy], #p-buy, #up-buy, #or-buy, #w-keep){background:#0A84FF}
:root[data-theme="light"] :is(.btn.store, .btn[data-buy], #p-buy, #up-buy, #or-buy, #w-keep){background:#007AFF}
.btn[data-buy]:disabled{opacity:.6}
/* one blue across the shop: Buy All outline, "Save" tag and in-season outline match the buy buttons */
:root{--store:#007AFF}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--store:#0A84FF} }
:root[data-theme="dark"]{--store:#0A84FF}
.shop-sec .pack.hol-all{border-color:var(--store)}
.shop-sec .packs > .pack.seasonal{border-color:var(--store)}
.shop-sec .hol-all .tag.hot, .trial-offer .tag.hot{background:var(--store); color:#fff}
.progress{height:6px; border-radius:999px; background:var(--bench); overflow:hidden}
.progress > i{display:block; height:100%; background:var(--accent); border-radius:inherit}
.how{margin:0; padding-left:20px; color:var(--muted); display:flex; flex-direction:column; gap:6px}
.how b{color:var(--ink); font-weight:600}
.chart{display:flex; flex-wrap:wrap; gap:6px}
.chip{display:inline-flex; align-items:center; gap:7px; font-family:var(--display); font-size:20px; font-weight:800; line-height:1; color:var(--ink); background:var(--panel); border:1.5px solid var(--line); border-radius:999px; padding:7px 14px; box-shadow:0 2px 6px var(--shadow)}
.chip .dot{width:22px; height:22px; box-shadow:inset 0 -3px 0 rgba(0,0,0,.18), 0 0 0 1.5px rgba(0,0,0,.08)}
.dot{width:12px; height:12px; border-radius:50%; display:inline-block; box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.foot{display:flex; justify-content:space-between; align-items:center; gap:10px; color:var(--muted); font-size:14px}
.linkbtn{background:none; border:0; padding:4px 0; color:var(--muted); text-decoration:underline; font-size:14px}
.iconbtn{background:var(--panel); border:1px solid var(--line); border-radius:10px; width:38px; height:38px; display:grid; place-items:center; padding:0}
.iconbtn svg{width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}

/* ---------- Game ---------- */
.bar{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; padding-top:4px}
.bar-left{justify-self:start; display:flex; align-items:center; gap:6px}
.back{background:none; border:0; padding:8px 2px; font-weight:600; color:var(--muted); display:flex; align-items:center; gap:2px}
.bar-title{font-family:var(--display); font-weight:800; font-size:22px; text-align:center; white-space:nowrap; letter-spacing:-.01em}
.bar-sub{display:block; font-family:var(--mono); font-weight:500; font-size:13px; color:var(--muted); letter-spacing:.04em}
.bar-right{justify-self:end; display:flex; align-items:center; gap:10px}
.moves{text-align:right; font-family:var(--mono); font-weight:700; font-size:18px; font-variant-numeric:tabular-nums}
.moves.low{color:#E0402F}
.moves small{display:block; font-family:var(--ui); font-weight:500; font-size:12px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase}
.bench{flex:1; min-height:0; display:flex; flex-direction:column; gap:8px}
.bench .chart{justify-content:center}
.stage{position:relative; flex:1; min-height:320px}
html, body{overflow-x:clip}
.stage canvas{position:absolute; left:-28px; top:-28px; width:calc(100% + 56px); height:calc(100% + 56px); display:block; touch-action:manipulation; pointer-events:none}
.hits{position:absolute; inset:0}
.hit{position:absolute; background:transparent; border:0; border-radius:14px; padding:0; touch-action:manipulation}
.tools{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.tool{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 6px; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:15px; font-weight:600}
.tool svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
.tool:disabled{opacity:.4; cursor:default}

/* ---------- Overlays ---------- */
.scrim{position:fixed; inset:0; background:color-mix(in srgb, #000 45%, transparent); display:flex; align-items:flex-end; justify-content:center; padding:16px; padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px)); z-index:10}

@media (min-width:700px){ .app{max-width:760px} }
.shopbtn{background:transparent; cursor:pointer}
.tools.four{grid-template-columns:repeat(4,1fr)}
.tools.two{grid-template-columns:repeat(2,1fr)}
.btn.share-pour{background:linear-gradient(90deg,#111,#2b2b2b); color:#fff; font-size:17px; padding:13px 12px; box-shadow:0 4px 0 #000, 0 8px 18px rgba(0,0,0,.25)}
.btn.share-pour:disabled{opacity:.7}
.a11y-sym .dot{position:relative} .a11y-sym .dot::after{content:attr(data-sym); position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; line-height:1; color:#fff; text-shadow:0 0 2px #000, 0 0 2px #000}
.a11y-sym .chip .dot::after{font-size:14px}
.a11y-big .app, .a11y-big .scrim .placard{zoom:1.12}
.a11y-contrast{--muted:var(--ink)} .a11y-contrast .card, .a11y-contrast .placard{border-width:2px; border-color:var(--ink)} .a11y-contrast .btn.ghost{box-shadow:inset 0 0 0 2px var(--ink)}
.ax-row{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:10px 2px; border-bottom:1px solid var(--line); text-align:left; cursor:pointer}

const Ads = {
  native: false, A: null, loading: {}, loaded: {interstitial: false, rewarded: false}, onClose: null, onReward: null, gotReward: false, shownN: 0,
  async init(){
    if(!isNative()) return;
    try{
      this.A = plugin("AdMob");
      await this.A.initialize({initializeForTesting: CONFIG.adsTesting || (IS_ANDROID && /3940256099942544/.test(CONFIG.admobAndroid.rewarded))});
      this.native = true;
      const closeI = () => { this.loaded.interstitial = false; resumeAudio(); const f = this.onClose; this.onClose = null; if(f) f(); this.prep("interstitial"); };
      this.A.addListener("interstitialAdDismissed", closeI);
      this.A.addListener("interstitialAdFailedToShow", closeI);
      this.A.addListener("onRewardedVideoAdReward", () => { this.gotReward = true; });
      const closeR = () => { this.loaded.rewarded = false; resumeAudio(); const f = this.onReward, ok = this.gotReward; this.onReward = null; this.gotReward = false; if(f) f(ok); this.prep("rewarded"); };
      this.A.addListener("onRewardedVideoAdDismissed", closeR);
      this.A.addListener("onRewardedVideoAdFailedToShow", closeR);
      this.prep("interstitial"); this.prep("rewarded");
    }catch(e){ this.native = false; }
  },
  async prep(kind){
    if(!this.native || this.loading[kind] || this.loaded[kind] || Store.noAds() && kind === "interstitial") return;

      if(kind === "interstitial") await this.A.prepareInterstitial({adId: (IS_ANDROID ? CONFIG.admobAndroid : CONFIG.admob).interstitial, isTesting: CONFIG.adsTesting});
      else await this.A.prepareRewardVideoAd({adId: (IS_ANDROID ? CONFIG.admobAndroid : CONFIG.admob).rewarded, isTesting: CONFIG.adsTesting});
      this.loaded[kind] = true;
    }catch(e){ this.loaded[kind] = false; setTimeout(() => this.prep(kind), 30000); }
    this.loading[kind] = false;
  },
  async askTracking(){
    // ask whenever iOS still says "not determined" (iOS itself only ever shows the prompt once per install)
    if(!this.native || this.askedTracking) return;

    try{ const s = await this.A.trackingAuthorizationStatus(); if(s && s.status === "notDetermined") await this.A.requestTrackingAuthorization(); }catch(e){}
  },
  interstitial(){
    return new Promise(res => {
      if(Store.noAds()) return res();

      this.shownN++; this.onClose = res; pauseAudio(); Analytics.track("ad_shown", {kind: "interstitial"});
      this.A.showInterstitial().catch(() => { resumeAudio(); const f = this.onClose; this.onClose = null; if(f) f(); });
    });
  },
  // after the 3rd between-level ad of a session: one quiet offer to remove them, at most once a day
  noAdsNudge(){

      P.noAdsNudgeDay = dateKey(); saveP(); Analytics.track("noads_nudge");

      scrim.innerHTML = `<div class="placard" role="dialog" aria-labelledby="na-h"><span class="placard-tag">Remove Ads</span><h2 id="na-h">Tired of ads?</h2>

      scrim.querySelector("#na-buy").onclick = async b => { b.target.disabled = true; Analytics.track("noads_nudge_tap"); const ok = await Store.buy(CONFIG.products.removeAds); b.target.disabled = false; if(ok){ scrim.remove(); res(); } };

  },
  rewarded(){
    return new Promise(async res => {

        if(!this.loaded.rewarded){

      this.A.showRewardVideoAd().then(() => { this.gotReward = true; }).catch(() => { resumeAudio(); const f = this.onReward; this.onReward = null; if(f) f(false); });
    });
  }

    if(!Cloud.P || !P.askedReminders) return;
    const out = [], now = new Date();
    for(let d = 0; d < 4 && out.length < 3; d++){
      const at = new Date(now.getFullYear(), now.getMonth(), now.getDate() + d, 18, 30);
      if(at <= now || (d === 0 && P.lastDaily === dateKey())) continue;
      const streak = P.lastDaily === dateKey() || P.lastDaily === yesterdayKey() ? P.streak : 0;
      out.push({at: at.getTime(), title: T("Today's experiment is ready 🧪"), body: T(streak > 1 && d <= 1 ? `Keep your ${streak} day streak going. One puzzle, a couple of minutes.` : "A new color puzzle is waiting in the lab.")});
    }

    const noon = d => { const t = new Date(now.getFullYear(), now.getMonth(), now.getDate() + d, 12, 15); return t.getTime(); };
    const tm = Login.tomorrow();
    if(tm){ let at = new Date(now.getTime() + 20*3600e3); if(at.getDate() === now.getDate()) at = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 10, 0);

    if(nx){ const e = EVENTS.find(x => x.from[0] === nx.getMonth() + 1 && x.from[1] === nx.getDate()); if(e) out.push({at: nx.getTime(), title: `${e.e} ${T(e.name)}`, body: T(`The ${THEMES[e.key].name} colors are free all week. Come play!`)}); }

  members: [], lastFetch: 0, busy: false, error: "",
  // names come only from these word lists, so there's no free text to moderate

    g.fillStyle = ink; g.textAlign = "center"; g.font = "800 76px 'Bricolage Grotesque', system-ui, sans-serif"; g.fillText("Beaker Lab", W/2, 150);
    g.font = "700 40px system-ui, sans-serif"; g.fillStyle = "#e5533d"; g.fillText(`${T(title)} 🧪`, W/2, 214);
    if(R && R.cv){ const src = R.cv, sc = Math.min((W - 40)/src.width, 820/src.height), dw = src.width*sc, dh = src.height*sc; g.drawImage(src, (W - dw)/2, 270 + (820 - dh)/2, dw, dh); }

// ---------- Lab Race: win 10 levels before 4 other scientists ----------
const RACERS = ["Dr. Fizz", "Prof. Bubbles", "Ada Beaker", "Max Flask", "Luna Vial", "Dr. Pipette", "Captain Carbon", "Nova Nitro", "Ivy Isotope", "Rex Reagent", "Dr. Glow", "Pip Potion"];
const Race = {
  on(){ return (P.level || 1) >= CONFIG.race.from; },
  cur(){
    if(!this.on()) return null;
    const now = Date.now(), r = P.race;
    if(r && (!r.over || now < r.over + 12*36e5)) return r;
    // start a new race: bots finish somewhere between ~24 and ~90 hours
    const names = RACERS.slice().sort(() => Math.random() - .5).slice(0, 4);
    P.race = {id: now, start: now, end: now + CONFIG.race.hours*36e5, wins: 0, bots: names.map(n => ({n, h: 20 + Math.random()*70})), over: 0, rank: 0, paid: 0};
    saveP(); return P.race;
  },
  botWins(b, at){ const r = P.race; return Math.min(CONFIG.race.goal, Math.floor(CONFIG.race.goal*((at - r.start)/36e5)/b.h)); },
  standings(){
    const r = this.cur(); if(!r) return [];
    const at = r.over || Math.min(Date.now(), r.end);
    const rows = r.bots.map(b => ({n: b.n, w: this.botWins(b, at), t: b.h, you: false}));
    rows.push({n: "You", w: r.wins, t: r.doneAt ? (r.doneAt - r.start)/36e5 : 1e9, you: true});
    return rows.sort((a, b) => (b.w - a.w) || (a.t - b.t));
  },
  won(){
    const r = this.cur(); if(!r || r.over) return;
    if(Date.now() > r.end){ this.finish(); return; }
    r.wins++; if(r.wins >= CONFIG.race.goal){ r.doneAt = Date.now(); this.finish(); } saveP();
  },
  finish(){
    const r = P.race; if(!r || r.over) return;
    r.over = Date.now();
    const st = this.standings(), me = st.findIndex(x => x.you), finished = r.wins >= CONFIG.race.goal;
    r.rank = finished ? me + 1 : 0;
    if(r.rank && r.rank <= 3 && !r.paid){ r.paid = 1; Coins.add(CONFIG.race.rewards[r.rank - 1]); Cards.give(3 - r.rank + 1); setTimeout(() => { toast(`Lab Race: you finished #${r.rank}! +${CONFIG.race.rewards[r.rank - 1]} Beaker Bucks and ${4 - r.rank} card pack${r.rank < 3 ? "s" : ""}`, 4600); sfx.complete(); }, 1600); }
    else setTimeout(() => toast(finished ? `Lab Race done: #${r.rank}. A new race starts soon!` : "Lab Race over. A new race starts soon!", 3600), 1600);
    Analytics.track("race_end", {rank: r.rank, wins: r.wins});
    saveP();
  },
  tick(){ const r = this.cur(); if(r && !r.over && Date.now() > r.end) this.finish(); },
  card(){
    const r = this.cur(); if(!r) return "";
    const st = this.standings(), left = Math.max(0, r.end - Date.now()), hrs = Math.floor(left/36e5), mins = Math.floor(left/6e4) % 60;
    return `<section class="card race-card" aria-labelledby="rc-h"><div class="card-top"><span class="eyebrow">Lab Race</span><span class="meta">${r.over ? "Finished" : `${hrs}h ${mins}m left`}</span></div>
      <h2 id="rc-h">🏁 First to win ${CONFIG.race.goal} levels</h2>
      <div class="race">${st.map((x, i) => `<div class="rrow ${x.you ? "you" : ""}"><span class="rpos">${i + 1}</span><span class="rname">${esc(T(x.n))}</span><div class="rbar"><i style="width:${100*x.w/CONFIG.race.goal}%"></i></div><span class="rw">${x.w}/${CONFIG.race.goal}</span></div>`).join("")}</div>
      <p class="meta">Top 3 win ${CONFIG.race.rewards.map(Coins.fmt).join(" / ")} Beaker Bucks plus card packs.</p></section>`;
  }
};

// ---------- Lab Pass: a monthly 30-step track with Free, Plus and Premium rewards ----------
const Pass = {
  key(){ const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}`; },
  on(){ return (P.level || 1) >= CONFIG.pass.from; },
  keys(){ return ((P.passKeys || {})[this.key()]) || 0; },
  tier(){ const t = (P.passTier || {})[this.key()] || 0; return t; },   // 0 free, 1 plus, 2 premium
  step(){ return Math.min(30, Math.floor(this.keys()/CONFIG.pass.keysPerStep)); },
  reward(i, track){   // step i = 1..30
    if(track === 0) return i % 3 === 0 ? (i % 10 === 0 ? {pack: 1} : {b: 40 + i*4}) : null;
    if(track === 1) return i % 5 === 0 ? {pack: 1} : i % 4 === 0 ? {hints: 2} : i % 6 === 0 ? {beaker: 1} : {b: 60 + i*6};
    return i === 30 ? {color: 1} : i % 3 === 0 ? {pack: 2} : i % 5 === 0 ? {beaker: 2} : {b: 120 + i*12};
  },
  label(x){ return !x ? "" : x.b ? `💵 ${x.b}` : x.pack ? `🃏 ${x.pack}` : x.hints ? `💡 ${x.hints}` : x.beaker ? `⚗️ ${x.beaker}` : "🎨 Pack"; },
  give(x){ if(!x) return; if(x.b) Coins.add(x.b); if(x.pack) Cards.give(x.pack); if(x.hints) P.hintBank = (P.hintBank || 0) + x.hints; if(x.beaker) P.freeBeakers = (P.freeBeakers || 0) + x.beaker;
    if(x.color){ const k = GIFT_ORDER.find(k => THEMES[k] && !themeOwned(k)); if(k) P.giftPacks = (P.giftPacks || []).concat([k]); else Coins.add(1000); } },
  // hand out every reward reached on the tracks the player owns (buying a tier later pays out what was already reached)
  claim(){
    if(!this.on()) return 0;
    const k = this.key(), got = Object.assign({}, (P.passGot || {})[k]), s = this.step(), t = this.tier(); let n = 0;
    for(let i = 1; i <= s; i++) for(let tr = 0; tr <= t; tr++){ const id = `${tr}:${i}`; if(got[id]) continue; got[id] = 1; const x = this.reward(i, tr); if(x){ this.give(x); n++; } }
    if(n){ P.passGot = Object.assign({}, P.passGot, {[k]: got}); saveP(); Cloud.push(); }
    return n;
  },
  won(extra){ if(!this.on()) return; const k = this.key(), before = this.step(); P.passKeys = Object.assign({}, P.passKeys, {[k]: this.keys() + 1 + (extra || 0)}); saveP(); if(this.step() > before){ const n = this.claim(); if(n) setTimeout(() => toast(`Lab Pass step ${this.step()} reached! ${n} reward${n > 1 ? "s" : ""} collected`, 3200), 1900); } },
  premiumNow(){ return this.tier() >= 2; },
  card(){
    if(!this.on()) return "";
    const s = this.step(), t = this.tier(), into = this.keys() % CONFIG.pass.keysPerStep, mon = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][new Date().getMonth()];
    return `<section class="card pass-card" aria-labelledby="pa-h"><div class="card-top"><span class="eyebrow">Lab Pass · ${mon}</span><span class="meta">${["Free", "Plus", "Premium"][t]}</span></div>
      <h2 id="pa-h">Step ${s} of 30</h2>
      <div class="progress" aria-hidden="true"><i style="width:${Math.round(100*s/30)}%"></i></div>
      <p class="meta">Every level win earns a key${s < 30 ? ` · ${CONFIG.pass.keysPerStep - into} more for step ${s + 1}` : ""}. Premium adds a free color pack at step 30 and no ads between levels all month.</p>
      <button class="btn ${t < 2 ? "accent" : ""}" id="pa-open">${t < 2 ? "See the rewards" : "Open Lab Pass"}</button></section>`;
  },
  open(){
    const s = this.step(), t = this.tier(), scrim = document.createElement("div"); scrim.className = "scrim center";
    const col = (i, tr) => { const x = this.reward(i, tr), have = tr <= t, reached = i <= s; return `<span class="pc ${x ? "" : "none"} ${reached && have && x ? "got" : ""} ${!have && x ? "lock" : ""}">${x ? this.label(x) : "·"}</span>`; };
    scrim.innerHTML = `<div class="placard shop journal" role="dialog" aria-labelledby="po-h"><button class="sh-x" id="po-x" aria-label="Close">&times;</button><span class="placard-tag">Lab Pass</span><h2 id="po-h">Step ${s} of 30</h2>
      <div class="pass-buy">
        ${t < 1 ? `<button class="btn accent" id="po-plus">Plus · ${esc(Store.price(CONFIG.pass.plus, "$4.99"))}</button>` : ""}
        ${t < 2 ? `<button class="btn store" id="po-prem">Premium · ${esc(Store.price(CONFIG.pass.premium, "$9.99"))}</button>` : `<p class="meta">Premium active: no ads between levels until the month ends.</p>`}
        ${t < 2 ? `<p class="meta">Buy any time this month and every reward you've already reached is yours at once. Premium includes Plus.</p>` : ""}</div>
      <div class="pgrid"><span class="ph">Step</span><span class="ph">Free</span><span class="ph">Plus</span><span class="ph">Premium</span>
      ${Array.from({length: 30}, (_, k) => k + 1).map(i => `<span class="pn ${i <= s ? "on" : ""}">${i}</span>${col(i, 0)}${col(i, 1)}${col(i, 2)}`).join("")}</div></div>`;
    document.body.appendChild(scrim);
    scrim.querySelector("#po-x").onclick = () => { scrim.remove(); render(); };
    const b1 = scrim.querySelector("#po-plus"), b2 = scrim.querySelector("#po-prem");
    if(b1) b1.onclick = async () => { Analytics.track("lab_pass_tap", {tier: 1}); const ok = await Store.buy(CONFIG.pass.plus); if(ok){ scrim.remove(); this.open(); } };
    if(b2) b2.onclick = async () => { Analytics.track("lab_pass_tap", {tier: 2}); const ok = await Store.buy(CONFIG.pass.premium); if(ok){ scrim.remove(); this.open(); } };
  }
};

const ROAD = [{b: 50}, {hints: 2}, {paid: "r1", b: 1200, pack: 1}, {b: 100}, {beaker: 1}, {paid: "r2", b: 3500, pack: 2}, {b: 200}, {pack: 1}, {paid: "r3", b: 8000, pack: 3, color: 1}, {b: 300}, {pack: 2}, {b: 500}];

  on(){ return (P.level || 1) >= CONFIG.road.from; },
  wk(){ return String(weekKey()); },
  pos(){ return ((P.road || {})[this.wk()]) || 0; },

  },
  async go(){ const x = ROAD[this.pos()]; if(!x) return; if(x.paid){ Analytics.track("road_tap", {i: this.pos()}); const ok = await Store.buy(this.id(x)); if(!ok) return; } else this.advance(); render(); }
};

const TOY_FRAMES = [["#ff6a3d","#c8341a","#a5250f","#2a1208"],["#4d8dff","#2456c9","#183f9c","#0c1e4a"],["#3ad27e","#1d9c56","#12703c","#0b2618"],["#ffcc3d","#e09a12","#b8780a","#2c1f05"],["#b56cff","#7a36d9","#5423a3","#1a0d33"],["#ff5da0","#d2286f","#9e1a52","#2e0a1c"],["#38d0e6","#1592ab","#0d6a7e","#062a33"],["#ff9a3d","#e0641a","#b04a0e","#2a1408"]];
// ---------- Slide puzzle: a plastic 3x3 sliding toy. Level wins earn slides; solve the picture for Bucks and a card pack ----------
const Picture = {
  cfg(){ return Object.assign({perWin: 4, perAd: 6, adsPerDay: 3, refill: 8, refillCost: 60, solveCost: 150, scramble: 14}, CONFIG.slideCfg || {}); },
  on(){ return (P.level || 1) >= (CONFIG.picFrom || 4); },
  st(){
    if(!P.pic || !P.pic.b){ const old = P.pic || {}; P.pic = {i: old.i || 0, done: old.done || 0, slides: 0, moves: 0, b: this.scrambled(old.i || 0), seen: 1, ads: 0, adDay: 0}; }
    return P.pic;
  },
  fresh(){ const p = this.st(); return this.on() && (p.slides > 0 && !p.seen); },
  // board: b[pos] = tile index (8 = empty). Scrambled by walking the empty slot from the solved state, so it's always solvable
  scrambled(i){

  },
  tileUrl(i){ if(!this._u) this._u = {}; if(!this._u[i]) this._u[i] = "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">${PICS[i % PICS.length]}</svg>`); return this._u[i]; },

  wire(root){
    const toy = root.querySelector("#toy"); if(!toy) return;
    const p = this.st(), c = this.cfg(), me = this;
    const upd = () => { const a = root.querySelector("#toy-slides"), m = root.querySelector("#toy-moves"); if(a){ a.textContent = `🧩 ${p.slides} ${T("slides")}`; a.classList.toggle("hot", p.slides > 0); } if(m) m.textContent = T(`${p.moves} moves`); };
    const place = () => { toy.querySelectorAll(".tile").forEach(el => { const k = +el.dataset.k; el.style.setProperty("--x", `calc(${k % 3}*(100% + 5px))`); el.style.setProperty("--y", `calc(${Math.floor(k/3)}*(100% + 5px))`); }); };
    // tap OR drag: a tile next to the gap follows your finger along its track (like the real toy),
    // clicks home if you let go past halfway, springs back if not. Other tiles just nudge.
    const commit = el => { const k = +el.dataset.k, e = p.b.indexOf(8); me.slide(k, root); el.dataset.k = String(e); place(); upd(); if(me.solved(p.b)){ toy.classList.add("done"); me.finish(root); } };
    toy.querySelectorAll(".tile").forEach(el => {
      let d = null;
      el.onpointerdown = ev => {
        if(me.solved(p.b)) return;
        el.classList.add("press"); audio();
        const k = +el.dataset.k, e = p.b.indexOf(8);
        if(!me.nbrs(e).includes(k)) { d = {k, tap: true}; return; }
        const rect = el.getBoundingClientRect(), step = rect.width + 5;   // one cell plus the gap
        const ax = (e % 3) - (k % 3), ay = Math.floor(e/3) - Math.floor(k/3);   // direction toward the gap (-1/0/1)
        d = {k, e, ax, ay, step, x0: ev.clientX, y0: ev.clientY, t0: performance.now(), off: 0, moved: false};
        el.setPointerCapture(ev.pointerId); el.classList.add("drag"); el.classList.remove("snap");
      };
      el.onpointermove = ev => {
        if(!d || d.tap) return;
        const dx = ev.clientX - d.x0, dy = ev.clientY - d.y0;
        const along = d.ax ? dx*d.ax : dy*d.ay;                 // distance toward the gap
        const off = Math.max(-d.step*.08, Math.min(d.step, along));   // can't go past the gap; a little give the other way
        if(Math.abs(along) > 4) d.moved = true;
        d.off = off;
        el.style.setProperty("--dx", `${off*d.ax}px`); el.style.setProperty("--dy", `${off*d.ay}px`);
        if(p.slides <= 0 && off > d.step*.25){ d.off = d.step*.25; el.style.setProperty("--dx", `${d.off*d.ax}px`); el.style.setProperty("--dy", `${d.off*d.ay}px`); }
      };
      const end = ev => {
        el.classList.remove("press");
        if(!d) return; const dd = d; d = null;
        if(dd.tap){ el.classList.remove("stuck"); void el.offsetWidth; el.classList.add("stuck"); sfx.bump(); return; }
        el.classList.remove("drag");
        const quick = performance.now() - dd.t0 < 220;
        const go = !dd.moved ? true : dd.off > dd.step*.5 || (quick && dd.off > dd.step*.15);
        el.style.setProperty("--dx", "0px"); el.style.setProperty("--dy", "0px");
        if(go && p.slides <= 0){ el.classList.add("snap"); sfx.bump(); buzz(15); toast(T("Out of slides. Win a level, watch a video or use Beaker Bucks."), 2600); return; }
        if(go){ el.classList.add("snap"); commit(el); buzz(10); }
        else { el.classList.add("snap"); sfx.bump && sfx.pick(); }
      };
      el.onpointerup = end; el.onpointercancel = end;
      el.onclick = ev => ev.preventDefault();
    });
    const ad = root.querySelector("#toy-ad"); if(ad) ad.onclick = async () => { ad.disabled = true; const ok = await Ads.rewarded(); if(!ok){ ad.disabled = false; return; }
      const today = dateKey(); if(p.adDay !== today){ p.adDay = today; p.ads = 0; } p.ads++; p.slides += c.perAd; saveP(); Analytics.track("ad_slides"); sfx.complete(); me.redraw(root); };
    const buy = root.querySelector("#toy-buy"); if(buy) buy.onclick = () => { audio(); if(!Coins.spend(c.refillCost)){ openShop("coins"); return; } p.slides += c.refill; saveP(); Analytics.track("buy_slides"); upd(); toast(`+${c.refill} ${T("slides")}`, 1600); };
    const sv = root.querySelector("#toy-solve"); if(sv) sv.onclick = () => { audio(); if(me.solved(p.b)) return; if(!Coins.spend(c.solveCost)){ openShop("coins"); return; } Analytics.track("buy_solve");
      // slide it home step by step (a quick search from the current board), so it looks like a real solve
      const path = me.solvePath(p.b); let k = 0;
      const step = () => { if(k >= path.length){ toy.classList.add("done"); me.finish(root); return; } const pos = path[k++], el = toy.querySelector(`.tile[data-k="${pos}"]`); const e = p.b.indexOf(8); [p.b[e], p.b[pos]] = [p.b[pos], p.b[e]]; p.moves++; if(el){ el.dataset.k = String(e); } place(); upd(); sfx.pick(); setTimeout(step, 170); };
      step(); };
  },
  // breadth-first search over 3x3 boards (at most 181,440 states; scrambles are short so it's quick)
  solvePath(start){
    const key = b => b.join(""), goal = "012345678", seen = new Map([[key(start), null]]), q = [start.slice()];
    while(q.length){ const b = q.shift(), kb = key(b); if(kb === goal) break; const e = b.indexOf(8);
      for(const k of this.nbrs(e)){ const nb = b.slice(); [nb[e], nb[k]] = [nb[k], nb[e]]; const nk = key(nb); if(!seen.has(nk)){ seen.set(nk, [kb, k]); q.push(nb); } }
      if(seen.size > 200000) break; }
    const out = []; let cur = goal; if(!seen.has(cur)) return out;
    while(seen.get(cur)){ const [prev, k] = seen.get(cur); out.unshift(k); cur = prev; }
    return out;
  },
  seen(){ const p = this.st(); if(!p.seen){ p.seen = 1; saveP(); } }
};

// ---------- Lab Events: a new goal every Monday-Thursday and Friday-Sunday, with a 3-step prize track ----------
const LAB_EVENTS = [
  {id: "mix", name: "Mix Madness", e: "🎨", desc: "Make mixes in any puzzle.", goals: [8, 20, 40]},
  {id: "wins", name: "Bubble Rush", e: "🫧", desc: "Win levels, daily or weekly puzzles.", goals: [3, 8, 15]},
  {id: "stars", name: "Star Hunt", e: "⭐", desc: "Earn stars on levels.", goals: [6, 15, 30]},
  {id: "combo", name: "Combo Craze", e: "🔥", desc: "Finish beakers back to back for combos.", goals: [3, 8, 16]},
  {id: "perfect", name: "Perfect Pour", e: "💎", desc: "Win levels with 3 stars.", goals: [2, 5, 10]}
];
const LEV_PRIZES = [{b: 60}, {b: 120, pack: 1}, {b: 300, beaker: 1}];
const LabEvents = {
  on(){ return (P.level || 1) >= (CONFIG.eventFrom || 6); },
  list(){ const r = CONFIG.labEvents; return Array.isArray(r) && r.length ? r : LAB_EVENTS; },
  slot(at = new Date()){
    const dow = (at.getDay() + 6) % 7, b = dow >= 4 ? 1 : 0;
    const mon = new Date(at.getFullYear(), at.getMonth(), at.getDate() - dow), days = Math.floor(Date.UTC(mon.getFullYear(), mon.getMonth(), mon.getDate())/864e5);
    const L = this.list(), idx = ((Math.floor(days/7)*2 + b) % L.length + L.length) % L.length, ev = L[idx];
    const end = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + (b ? 7 : 4));
    const goals = b ? ev.goals.map(g => Math.max(1, Math.round(g*.6))) : ev.goals;
    return {id: `${days}-${b}`, ev, goals, end: end.getTime(), start: new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + (b ? 4 : 0)).getTime()};
  },
  cur(){ const s = this.slot(); if(!P.lev || P.lev.id !== s.id) P.lev = {id: s.id, v: 0, got: 0}; return Object.assign({}, s, {v: P.lev.v, got: P.lev.got}); },
  // called on every win with what the puzzle did; returns the prize just finished (if any) for the win card
  won(m){
    if(!this.on()) return null;
    const c = this.cur(), add = {mix: m.mixes || 0, wins: 1, stars: m.stars || 0, combo: m.combos || 0, perfect: m.stars === 3 ? 1 : 0}[c.ev.id] || 0;
    if(!add) return null;
    P.lev.v += add; let prize = null;
    while(P.lev.got < 3 && P.lev.v >= c.goals[P.lev.got]){ const x = LEV_PRIZES[P.lev.got]; Pass.give(x); P.lev.got++; prize = Object.assign({step: P.lev.got}, x); Analytics.track("lab_event_step", {ev: c.ev.id, step: P.lev.got}); }
    saveP(); Cloud.push(); return prize;
  },
  left(){ const ms = Math.max(0, this.slot().end - Date.now()), h = Math.floor(ms/36e5); return h >= 24 ? `${Math.floor(h/24)}d ${h % 24}h` : `${h}h ${Math.floor(ms/6e4) % 60}m`; },
  badge(){ if(!this.on()) return ""; const c = this.cur(); return c.got >= 3 ? "✓" : `${c.v}/${c.goals[c.got]}`; },
  label(x){ return [x.b ? `💵 ${x.b}` : "", x.pack ? `🃏 ${x.pack}` : "", x.beaker ? `⚗️ ${x.beaker}` : ""].filter(Boolean).join(" "); },
  card(){
    if(!this.on()) return "";
    const c = this.cur(), top = c.goals[2], nx = this.slot(new Date(c.end + 36e5)).ev;
    return `<section class="card lev-card" aria-labelledby="lev-h"><div class="card-top"><span class="eyebrow">Lab Event</span><span class="meta">Ends in ${this.left()}</span></div>
      <h2 id="lev-h">${c.ev.e} <span>${esc(T(c.ev.name))}</span></h2><p class="meta">${esc(T(c.ev.desc))}</p>
      <div class="lev-bar"><div class="progress" aria-hidden="true"><i style="width:${Math.min(100, Math.round(100*c.v/top))}%"></i></div></div>
      <div class="lev-marks">${c.goals.map((g, i) => `<div class="tier ${i < c.got ? "got" : c.v >= g ? "ready" : ""}"><small>${g}</small><b>${this.label(LEV_PRIZES[i])}</b></div>`).join("")}</div>
      <p class="meta">${c.got >= 3 ? "Event complete! A new one starts soon." : `${Math.min(c.v, top)} of ${top} · ${c.goals[c.got] - c.v} more for the next prize`}</p>
      <p class="lev-next"><span>Up next:</span> ${nx.e} <b>${esc(T(nx.name))}</b></p></section>`;
  }
};

const BOOSTS = [{id: "beaker", e: "⚗️", name: "Extra beaker"}, {id: "moves", e: "➕", name: "+5 moves"}, {id: "hints", e: "💡", name: "+2 hints"}, {id: "undos", e: "↩️", name: "+3 undos"}];

  resuming(){ const sv = P.saved && P.saved.level; return !!(sv && sv.key === P.level && !sv.won); },
  eligible(){ return (P.level || 1) >= (CONFIG.boostFrom || 8) && !this.resuming() && !A11Y("zen"); },
  list(){ const b = Store.hasBundle(); return BOOSTS.filter(x => !(b && (x.id === "hints" || x.id === "undos"))); },
  cost(id){ if(id === "beaker" && ((P.freeBeakers || 0) > 0 || Store.hasBundle())) return 0; return (CONFIG.boostCost || {})[id] || 0; },
  // resolves true to start the level, false if the player closed the sheet
  offer(){
    if(!this.eligible()) return Promise.resolve(true);
    return new Promise(res => {
      const pick = new Set(), n = P.level, hard = hardness(n);
      const scrim = document.createElement("div"); scrim.className = "scrim center";

        <div class="boost-grid">${this.list().map(x => { const c = this.cost(x.id); return `<button class="boost-t ${c ? "" : "free"}" data-b="${x.id}" aria-pressed="false"><i>${x.e}</i><b>${x.name}</b><small>${c ? `${Coins.fmt(c)} 💵` : x.id === "beaker" && (P.freeBeakers || 0) > 0 ? `Free · ${P.freeBeakers} saved` : "Free"}</small></button>`; }).join("")}</div>
        <button class="btn accent" id="bo-go">Play</button>
        <p class="meta coin-have">You have 💵 <span class="coin-bal">${Coins.fmt(Coins.bal())}</span></p></div>`;
      document.body.appendChild(scrim);
      const go = scrim.querySelector("#bo-go");
      const upd = () => { const t = total(); go.textContent = t > Coins.bal() ? T("Get Beaker Bucks") : t ? T(`Play · ${Coins.fmt(t)} 💵`) : T("Play"); go.classList.toggle("coin", t > Coins.bal()); };
      scrim.querySelectorAll(".boost-t").forEach(b => b.onclick = () => { const id = b.dataset.b; pick.has(id) ? pick.delete(id) : pick.add(id); b.classList.toggle("on", pick.has(id)); b.setAttribute("aria-pressed", pick.has(id)); sfx.pick(); buzz(); upd(); });
      scrim.querySelector("#bo-x").onclick = () => { scrim.remove(); res(false); };

        scrim.remove(); res(true);
      };

  apply(key){

    if(b.beaker && !S.extra){ S.extra = 1; P.usedBeaker = 1; stBump("beakers"); S.shelves.push([]); S.initial.push([]); if(S.hid) S.hid.push(0); }
    if(b.moves) S.limit = (S.limit || 0) + 5;
    if(b.hints) S.hintBonus = (S.hintBonus || 0) + 2;

    setTimeout(() => toast("Boosters ready. Good luck!", 2200), 700);
  }

// ---------- Super Stir: charged by 3 wins in a row; one tap plays the next 5 best pours for you, free ----------
async function superStir(){
  if(S.won || !S.stir || S.stirUsed || S.screen !== "game") return;
  settleAll();
  const path = solve(S.shelves, 30000);
  if(!path || !path.length){ toast("Nothing to stir right now. Try Undo first."); return; }
  S.stirUsed = 1; stBump("stirs"); LV.bump("stir"); Analytics.track("super_stir");
  const b = document.getElementById("stir"); if(b) b.remove();
  sfx.complete(); buzz(30); toast("✨ Super Stir: 5 free pours!", 2200);
  const me = S, n = Math.min(5, path.length);
  S.bonus = (S.bonus || 0) + n; updateHud();
  for(let k = 0; k < n; k++){
    if(S !== me || S.won) return;
    await new Promise(r => setTimeout(r, 180)); tap(path[k].from);
    await new Promise(r => setTimeout(r, 260)); if(S !== me || S.won) return; tap(path[k].to);
    await new Promise(r => setTimeout(r, 620));
  }
}

const PASS_TIERS = [{w: 3, b: 150, free: true}, {w: 6, beaker: 2}, {w: 10, b: 400}, {w: 15, pack: true}, {w: 20, b: 800}];
const EventPass = {
  key(){ const e = eventNow(); return e ? `${e.key}${new Date().getFullYear()}` : null; },
  owned(){ const k = this.key(); return !!(k && (P.evPass || {})[k]); },
  wins(){ const k = this.key(); return k ? (P.evWins || {})[k] || 0 : 0; },
  won(){ const k = this.key(); if(!k) return; P.evWins = Object.assign({}, P.evWins, {[k]: this.wins() + 1}); saveP(); this.claim(false); },
  claim(quiet){
    const k = this.key(), e = eventNow(); if(!k) return;
    const got = new Set((P.evClaimed || {})[k] || []), w = this.wins(), own = this.owned(); let any = false;
    PASS_TIERS.forEach((t, i) => {
      if(got.has(i) || w < t.w || !(t.free || own)) return;
      got.add(i); any = true;
      if(t.b) Coins.add(t.b);
      if(t.beaker) P.freeBeakers = (P.freeBeakers || 0) + t.beaker;
      if(t.pack){ if(themeBought(e.key)) Coins.add(500); else P.giftPacks = (P.giftPacks || []).concat([e.key]); }
      if(!quiet) setTimeout(() => toast(`Event reward: ${t.b ? `${t.b} Beaker Bucks` : t.beaker ? `${t.beaker} extra beakers` : `the ${THEMES[e.key].name} colors, yours to keep`}!`, 3600), 1500);
    });
    if(any){ P.evClaimed = Object.assign({}, P.evClaimed, {[k]: [...got]}); saveP(); Cloud.push(true); }
  },
  card(){
    const e = eventNow(); if(!e) return "";
    const w = this.wins(), own = this.owned(), got = new Set((P.evClaimed || {})[this.key()] || []);
    const tiers = PASS_TIERS.map((t, i) => `<div class="tier ${got.has(i) ? "got" : w >= t.w && (t.free || own) ? "ready" : ""} ${t.free || own ? "" : "locked"}"><small>${t.w} wins</small><b>${t.b ? `💵 ${t.b}` : t.beaker ? `⚗️ ${t.beaker}` : "🎨"}</b>${t.free ? "<em>Free</em>" : own ? "" : "<em>🔒</em>"}</div>`).join("");
    return `<section class="card pass-card" aria-labelledby="ps-h"><div class="card-top"><span class="eyebrow">Event pass</span><span class="meta">${w} level wins this event</span></div>
      <h2 id="ps-h">${esc(e.name)} rewards</h2><div class="tiers">${tiers}</div>
      <p class="meta">${own ? "You have the pass. Rewards arrive as you win levels." : "Win levels to fill the track. The pass unlocks every reward, including the event colors to keep."}</p>
      ${own ? "" : `<button class="btn accent" id="ps-buy">Get the event pass · ${esc(Store.price(CONFIG.eventPass, "$4.99"))}</button>`}</section>`;
  }
};

// ---------- Level funnel: one event per level attempt, so the dashboard shows where players struggle or quit ----------
// LV.begin at level start; LV.end(outcome) once, on win / quit / skip / new game. Payload keeps every counter on the attempt.
const LV = {
  cur: null,
  begin(){
    if(S.mode !== "level") { this.cur = null; return; }
    this.end("abandon");   // a previous attempt still open (e.g. app was killed) counts as abandoned
    this.cur = {key: S.key, hard: S.hard || 0, ob: S.shelves.ob ? Object.keys(S.shelves.ob)[0] : "", mys: S.hid ? 1 : 0, limit: S.limit || 0, t0: Date.now(),
      hints: 0, undos: 0, restarts: 0, oom: 0, oomAd: 0, oomBucks: 0, mercy: 0, beaker: 0, stir: 0, boost: S.boostN || 0, resumed: S.moves > 0 ? 1 : 0};
    if(S.key <= 60 || S.key % 10 === 0) Analytics.track("level_start", {key: S.key, hard: this.cur.hard, ob: this.cur.ob, mys: this.cur.mys, resumed: this.cur.resumed});
  },
  bump(k){ if(this.cur) this.cur[k] = (this.cur[k] || 0) + 1; },
  end(outcome){
    const c = this.cur; if(!c) return; this.cur = null;
    const secs = Math.round((Date.now() - c.t0)/1000);
    Analytics.track("level_end", {key: c.key, outcome, moves: S.moves || 0, limit: c.limit, secs, hard: c.hard, ob: c.ob, mys: c.mys,
      hints: c.hints, undos: c.undos, restarts: c.restarts, oom: c.oom, oomAd: c.oomAd, oomBucks: c.oomBucks, mercy: c.mercy, beaker: c.beaker, stir: c.stir, boost: c.boost, resumed: c.resumed});
    // running per-level fail tally on the device too, for the difficulty tuner
    if(outcome !== "win"){ P.lvFail = P.lvFail || {}; P.lvFail[c.key] = (P.lvFail[c.key] || 0) + 1; }
  }
};
const Analytics = {
  q: [], sid: Math.random().toString(36).slice(2) + Date.now().toString(36), user: null,
  on(){ return !!CONFIG.telemetryAppID && !/REPLACE/.test(CONFIG.telemetryAppID); },
  async uid(){
    if(this.user) return this.user;
    if(!P.anonId){ P.anonId = Math.random().toString(36).slice(2) + Date.now().toString(36); saveP(); }
    try{ const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(P.anonId + ":beakerlab")); this.user = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join(""); }
    catch(e){ this.user = P.anonId; }
    return this.user;
  },
  track(type, payload = {}){
    try{
      if(!this.on()) return;
      const base = {level: P.level || 1, lang: (navigator.language || "").slice(0, 2), everything: Store.hasBundle() ? 1 : 0, day: this.day(), platform: IS_ANDROID ? "android" : "ios"};
      this.q.push({type, payload: Object.entries(Object.assign(base, payload)).map(([k, v]) => `${k}:${v}`)});
      if(this.q.length >= 12) this.flush();
    }catch(e){}
  },
  async flush(){
    if(!this.on() || !this.q.length) return;
    const items = this.q.splice(0, 50);
    try{
      const u = await this.uid();
      await fetch(`https://nom.telemetrydeck.com/v2/namespace/${CONFIG.telemetryNamespace}/`, {method: "POST", keepalive: true, headers: {"Content-Type": "application/json"},
        body: JSON.stringify(items.map(i => ({appID: CONFIG.telemetryAppID, clientUser: u, sessionID: this.sid, type: i.type, payload: i.payload, isTestMode: "false", telemetryClientVersion: "BeakerLab-JS 1.0"})))});
    }catch(e){ if(this.q.length < 200) this.q.unshift(...items); }
  },
  // days since this player installed (0 = install day): lets the dashboard measure day 1 / 7 / 30 retention by cohort
  day(){ if(!P.installAt){ P.installAt = Date.now(); saveP(); } return Math.max(0, Math.floor((Date.now() - P.installAt)/864e5)); },
  init(){ if(!this.on()) return; setInterval(() => this.flush(), 20000); document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden") this.flush(); });
    const fresh = !P.installAt; this.day(); if(fresh) this.track("first_open");
    this.track("app_open"); if(P.lastActive !== dateKey()){ P.lastActive = dateKey(); saveP(); this.track("daily_active"); } }
};

function winFx(scrim, stars, bucks){
  const row = scrim.querySelector(".wstars"), wb = scrim.querySelector("#w-bucks"), rm = reduceMotion();
  const countUp = () => { if(!wb) return; if(rm){ wb.textContent = `+${bucks}`; return; }
    const t0 = performance.now(), dur = Math.min(900, 300 + bucks*6);
    const step = now => { if(!wb.isConnected || wb.dataset.done) return; const k = Math.min(1, (now - t0)/dur), v = Math.round(bucks*(1 - Math.pow(1 - k, 3)));
      if(wb.textContent !== `+${v}`){ wb.textContent = `+${v}`; wb.classList.remove("bump"); void wb.offsetWidth; wb.classList.add("bump"); }
      if(k < 1) requestAnimationFrame(step); else { wb.dataset.done = 1; sfx.pick && sfx.pick(); } };
    requestAnimationFrame(step); };
  if(!row){ setTimeout(countUp, 300); return; }
  const els = [...row.querySelectorAll(".ws")];
  const burst = (el, big) => { const n = big ? 16 : 10, cols = ["#FFC400", "#ff7a18", "#ff3d77", "#7b5cff", "#2fd3ff"];
    for(let i = 0; i < n; i++){ const p = document.createElement("span"), a = i/n*Math.PI*2 + Math.random()*.4, r = (big ? 62 : 44) + Math.random()*18;
      p.className = "wspark"; p.style.background = cols[i % cols.length]; p.style.setProperty("--dx", `${Math.cos(a)*r}px`); p.style.setProperty("--dy", `${Math.sin(a)*r}px`);
      el.appendChild(p); setTimeout(() => p.remove(), 750); } };
  // the glow sits behind the highest star earned (it glides along as each star lands)
  const glowAt = el => { const r = row.getBoundingClientRect(), e = el.getBoundingClientRect(); row.style.setProperty("--gx", `${e.left + e.width/2 - r.left}px`); row.style.setProperty("--gy", `${e.top + e.height/2 - r.top}px`); };
  if(stars > 0) glowAt(els[0]);
  if(rm){ els.forEach((el, i) => i < stars && el.classList.add("on")); if(stars > 0){ glowAt(els[stars - 1]); row.classList.add("lit"); } countUp(); return; }
  els.forEach((el, i) => { if(i >= stars) return; setTimeout(() => { if(!row.isConnected) return; el.classList.add("on"); sfx.star(i); buzz(i === 2 ? 30 : 15); setTimeout(() => burst(el, i === 2), 220); glowAt(el); if(i === 0) row.classList.add("lit"); }, 450 + i*420); });
  setTimeout(countUp, 450 + stars*420 + 150);
}

function weekKey(d = new Date()){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);

/* ---------- Game scene ---------- */
let R = null;          // renderer state for the game screen
function stopAllFill(){ if(R) R.pours.forEach(p => { if(p.fill){ p.fill.stop(); p.fill = null; } }); }

function makeVis(sh, i){ return {segs: segsOf(sh, (S.hid && S.hid[i]) || 0), lift:0, liftV:0, th:0, om:0, shake:0, cork: isDone(sh) ? 1 : null, hint:0, bubbles:[], ripple:0, phase:Math.random()*6, mixFx:null, prevX:null, prevV:0, busy:0, wallB: wallBubbles(), fizz:0, corkWig:0}; }
function syncVis(i){ const v = R.vis[i], sh = S.shelves[i]; revealTops(); v.segs = segsOf(sh, (S.hid && S.hid[i]) || 0); v.mixFx = null; v.cork = isDone(sh) ? (v.cork === null ? 1 : v.cork) : null; }

function layoutScene(){
  const n = S.shelves.length, cols = n <= 5 ? n : Math.ceil(n/2), rows = Math.ceil(n/cols);
  const cw = R.w / cols;
  let W = Math.min(R.w > 600 ? 86 : 62, cw*.56), G = geomFor(W);
  const topPad = 34, gapY = 52;
  const need = topPad + rows*(G.H + gapY);
  if(need > R.h){ W = Math.max(26, W * (R.h - 10) / need); G = geomFor(W); }
  const rowH = G.H + gapY, used = topPad + rows*rowH - gapY;
  const y0 = Math.max(topPad, (R.h - used)/2 + topPad);
  R.G = G;
  R.homes = S.shelves.map((_, i) => {
    const row = Math.floor(i/cols), col = i % cols;
    const inRow = row === rows - 1 ? n - cols*(rows - 1) : cols;
    return {x: (col + .5 + (cols - inRow)/2) * cw, y: y0 + row*rowH};
  });
  // accessible hit targets
  R.hits.innerHTML = R.homes.map((h, i) => `<button class="hit" data-i="${i}" style="left:${h.x - G.W/2 - 10}px; top:${h.y - 22}px; width:${G.W + 20}px; height:${G.H + 34}px"></button>`).join("");
  R.hits.querySelectorAll(".hit").forEach(b => b.onclick = () => tap(+b.dataset.i));
  labelHits();
}
function labelHits(){
  if(!R) return;
  R.hits.querySelectorAll(".hit").forEach(b => {
    const i = +b.dataset.i, sh = S.shelves[i];
    b.setAttribute("aria-label", sh.length ? `Beaker ${i+1}, bottom to top: ${sh.map(c => T(COLORS[c]) + (A11Y("sym") ? ` ${T(SYMBOL_NAMES[c])}` : "")).join(", ")}${isDone(sh) ? ", sealed" : ""}` : `Beaker ${i+1}: empty`);
    b.setAttribute("aria-pressed", String(S.sel === i));
  });
}
const CV_BLEED = 28;
function resizeScene(){
  if(!R) return;
  const rect = R.stage.getBoundingClientRect();
  if(rect.width < 40 || rect.height < 40) return;
  R.dpr = Math.min(2.5, window.devicePixelRatio || 1);
  R.w = rect.width; R.h = rect.height;
  // the canvas bleeds 28px past the stage on every side so glows and splashes are never cut off at the edge
  R.cv.width = Math.round((R.w + 2*CV_BLEED) * R.dpr); R.cv.height = Math.round((R.h + 2*CV_BLEED) * R.dpr);
  layoutScene();
}
function homePose(i, dir){
  const h = R.homes[i], v = R.vis[i], G = R.G;
  const sx = v.shake > 0 ? Math.sin(v.shake*(v.shakeF || 38)) * v.shake * (v.shakeK || .5) : 0;
  if(v.wig > 0 && !dir){
    // rock on its base like a bobblehead: a quick lean, a couple of springy swings back, and a tiny hop
    const k = 1 - v.wig, a = Math.sin(k*Math.PI*5) * Math.pow(v.wig, 1.3) * .17, hop = Math.sin(Math.min(1, k*2.2)*Math.PI) * 5 * v.wig;
    return {px: h.x, py: h.y + v.lift + G.H - hop, lx: 0, ly: G.H, a: a + sx};
  }
  return {px: h.x + (dir || 0)*G.r, py: h.y + v.lift, lx: (dir || 0)*G.r, ly: 0, a: sx};
}

function startScene(){
  readPalette();
  R = {stage: document.getElementById("stage"), cv: document.getElementById("cv"), hits: document.getElementById("hits"),
       vis: S.shelves.map(makeVis), pours: [], parts: [], rings: [], last: performance.now(), raf: 0, pendingWin: false, winAt: 0};
  R.ctx = R.cv.getContext("2d");
  resizeScene();
  if(R.ro) R.ro.disconnect();
  if(window.ResizeObserver){ R.ro = new ResizeObserver(() => resizeScene()); R.ro.observe(R.stage); }
  const loop = now => {
    if(!R || S.screen !== "game") return;
    const dt = Math.min(.05, (now - R.last)/1000); R.last = now;
    if(R.G){ step(dt); draw(); } else resizeScene();
    R.raf = requestAnimationFrame(loop);
  };
  R.raf = requestAnimationFrame(loop);
}
function stopScene(){ if(!R) return; stopAllFill(); cancelAnimationFrame(R.raf); if(R.ro) R.ro.disconnect(); R = null; }

function spawnSplash(x, y, rgb, n, power = 1){
  for(let k = 0; k < n; k++){
    R.parts.push({x: x + (Math.random() - .5)*4, y, vx: (Math.random() - .5)*110*power, vy: -(50 + Math.random()*140)*power, r: .9 + Math.random()*1.9, rgb, life: 0, max: .45 + Math.random()*.35, floor: y + 2});
  }

/* ---------- Pouring ---------- */
function beginPour(from, to, info, color, completes, combo){
  const G = R.G, hs = R.homes[from], ht = R.homes[to];
  let dir = Math.sign(ht.x - hs.x); if(!dir) dir = ht.x > R.w/2 ? -1 : 1;
  const vs = R.vis[from], vt = R.vis[to];
  const amount = info.n || 1;
  const srcVol = volOf(vs.segs);
  const p = {from, to, info, dir, amount, left: amount, rgb: PAL.c[color], ci: color, phase: 0, t: 0, stream: 0,
             startLift: vs.lift, alpha0: pourAngle(G, srcVol, dir), completes, combo, fill: null, splashAcc: 0, mixIdx: null};
  p.pose = homePose(from, dir); p.pose.py = hs.y + vs.lift;
  vs.busy++; vt.busy++;

  const tTop = vt.segs[vt.segs.length - 1];
  if(info.kind === "pour" && tTop && tTop.ci === color){ p.tSeg = tTop; }
  else { p.tSeg = {ci: color, v: 0}; vt.segs.push(p.tSeg); }

}
function pourTargetPivot(p){

  return [ht.x - p.dir*G.r*.35, ht.y + R.vis[p.to].lift - 10];
}
function stepPour(p, dt){
  const G = R.G, vs = R.vis[p.from], vt = R.vis[p.to], hs = R.homes[p.from];
  p.t += dt;
  const home = [hs.x + p.dir*G.r, hs.y + (p.phase < 3 ? p.startLift : vs.lift)];
  const aim = pourTargetPivot(p);
  const lipLocal = {lx: p.dir*G.r, ly: 0};
  const MOVE = .26, TILT = .12, BACK = .3;
  if(p.phase === 0){
    const e = ease(clamp01(p.t/MOVE));
    p.pose = {px: lerp(home[0], aim[0], e), py: lerp(home[1], aim[1], e) - Math.sin(e*Math.PI)*26, ...lipLocal, a: p.dir*p.alpha0*.72*e};
    if(p.t >= MOVE){ p.phase = 1; p.t = 0; }
  } else if(p.phase === 1){
    const e = ease(clamp01(p.t/TILT));
    p.pose = {px: aim[0], py: aim[1], ...lipLocal, a: p.dir*p.alpha0*lerp(.72, 1.02, e)};
    if(p.t >= TILT){ p.phase = 2; p.t = 0; p.fill = sfx.fill(p.left/pourRate(), themeFx().includes("thick")); }
  } else if(p.phase === 2){
    const rate = pourRate();
    const dv = Math.min(p.left, rate*dt);
    p.left -= dv; p.sSeg.v = Math.max(0, p.sSeg.v - dv); p.tSeg.v += dv;
    if(p.sSeg.v <= 1e-4){ const k = vs.segs.indexOf(p.sSeg); if(k >= 0) vs.segs.splice(k, 1); }
    p.stream = Math.min(1, p.stream + dt*14);

    p.pose = {px: aim[0], py: aim[1], ...lipLocal, a: p.dir*lerp(Math.abs(p.pose.a), want, clamp01(dt*18))};
    // target surface (upright glass)
    const ht = R.homes[p.to];
    const tp = {px: ht.x, py: ht.y + vt.lift, lx: 0, ly: 0, a: 0};
    p.surfY = levelFor(G.pts.map(q => toWorld(tp, q)), 0, 1, volOf(vt.segs) * G.unitVol);
    const lip = toWorld(p.pose, [p.dir*G.r, 0]);
    const ix = lip[0] + p.dir*G.r*.25;
    p.splashAcc += dt*26;
    while(p.splashAcc > 1){ p.splashAcc -= 1; spawnSplash(ix, p.surfY, p.rgb, 1, .6); }
    p.bubAcc = (p.bubAcc || 0) + dt*30;
    while(p.bubAcc > 1){ p.bubAcc -= 1; const depth = bottomY(p.to) - p.surfY; if(depth > 4) addBubble(vt, ix + (Math.random() - .5)*G.w*.3, p.surfY + 2 + Math.random()*depth*.6, .5 + Math.random()*1.4); }
    p.ringAcc = (p.ringAcc || 0) + dt*9;
    while(p.ringAcc > 1){ p.ringAcc -= 1; R.rings.push({i: p.to, x: ix, y: p.surfY, r: 1, max: G.r*.85, life: 0}); }
    vt.ripple = 1; vt.om += (Math.random() - .5) * 6 * dt * 10;

    if(p.t >= BACK){ finishPour(p, false); vs.om += p.dir*2.2; }
  }
}
function afterFill(p){
  const vt = R.vis[p.to];
  if(p.info.kind === "mix"){
    // only the two touching layers swirl into the new colour: if the colour underneath is
    // more than one layer deep, split off its top layer so the rest keeps its colour
    let n = vt.segs.length;
    const under = vt.segs[n - 2];
    if(!p.info.full && under && under.v > 1){ under.v -= 1; vt.segs.splice(n - 1, 0, Object.assign({}, under, {v: 1})); n++; }
    const idx = p.info.full ? vt.segs.map((x, k) => k) : [n - 2, n - 1].filter(k => k >= 0);
    vt.mixFx = {t: 0, dur: p.info.full ? .8 : .55, idx, from: idx.map(k => segColor(vt.segs[k])), to: p.info.c};
    vt.fizz = p.info.full ? 1.6 : 1.1; vt.fizzFrom = p.info.full ? 0 : Math.max(0, volOf(vt.segs) - 2);

  } else if(p.info.n && vt.segs.length){
    const below = S.shelves[p.to].length - p.info.n;
    if(below > 0) sfx.clink();
  }
  if(p.completes){
    p.completes = false;
    vt.cork = 0;
    setTimeout(() => { if(p.combo >= 2){ sfx.combo(p.combo); showCombo(p.combo); } else sfx.complete(); }, 160);
    buzz(25);
  }

}
function finishPour(p, instant){
  if(p.fill){ p.fill.stop(); p.fill = null; }
  const i = R.pours.indexOf(p); if(i >= 0) R.pours.splice(i, 1);
  const vs = R.vis[p.from], vt = R.vis[p.to];
  vs.busy = Math.max(0, vs.busy - 1); vt.busy = Math.max(0, vt.busy - 1);
  if(instant && !p.afterDone){
    if(p.completes){ vt.cork = 1; }
    if(p.info.kind === "mix"){ vt.mixFx = null; }
  }
  if(!vs.busy) syncVis(p.from);
  if(!vt.busy && !vt.mixFx) syncVis(p.to);
  if(instant && p.completes && vt.cork === null) vt.cork = 1;
}
function settle(i){ // finish any animation touching beaker i right away
  if(!R) return;
  for(const p of R.pours.slice()) if(p.from === i || p.to === i) finishPour(p, true);
  const v = R.vis[i]; if(v.mixFx){ v.mixFx = null; syncVis(i); }
}
function settleAll(){ if(!R) return; for(const p of R.pours.slice()) finishPour(p, true); R.vis.forEach((v, i) => { if(v.mixFx){ v.mixFx = null; } syncVis(i); }); }

/* ---------- Render: Home ---------- */

  drawBeaker(ctx, G, {px: cw/2, py: top, lx: 0, ly: 0, a: 0}, segsOf(sh), fz ? {th: 0, fx: themeFx(), seed: sh.length, ripple: fz.rip, phase: fz.ph, bubbles: fz.bub, wallB: fz.wall} : {th: 0, cork: isDone(sh) ? 1 : null, fx: themeFx(), seed: sh.length});

// home equation beakers: animated like the game (gentle ripple, rising bubbles) with soda-style fizz

function animateEquation(ids){
  const cs = ids.map((id, k) => ({cv: document.getElementById(id), sh: [[0], [2], [5, 5]][k]})).filter(c => c.cv);
  if(!cs.length) return;
  const W = innerHeight < 760 ? 34 : 40, G = geomFor(W), cw = W + 20, top = 30;
  cs.forEach((c, k) => { c.fz = {rip: .2, ph: k*2, bub: [], fizz: [], wall: wallBubbles()}; c.acc = 0; c.surf = top + G.H - c.sh.length*G.U*.98 - 2; });
  let last = 0;
  const frame = now => {
    if(!cs[0].cv.isConnected) return;
    const dt = Math.min(.05, last ? (now - last)/1000 : .016); last = now;
    const calm = reduceMotion();
    for(const c of cs){
      const z = c.fz; z.ph += dt*2.2; z.rip = .18 + .08*Math.sin(now/900 + c.surf) + Math.abs(Tilt.v)*.6;
      if(!calm){
        c.acc += dt*(2.4 + Math.random());
        while(c.acc > 1){ c.acc -= 1; z.bub.push({x: cw/2 + (Math.random() - .5)*G.r*1.1, y: top + G.H - 4 - Math.random()*4, r: .6 + Math.random()*1.1, a: 0, vy: -10 - Math.random()*14, w: Math.random()*6.28}); }
        for(const b of z.bub){
          b.vy -= dt*6; b.y += b.vy*dt; b.w += dt*5; b.x += Math.sin(b.w)*dt*4; b.a = Math.min(1, b.a + dt*3);
          if(b.y <= c.surf + 1){ b.dead = 1; if(Math.random() < .8) z.fizz.push({x: b.x, y: c.surf - 1, r: Math.max(.5, b.r*.8), a: .95, vy: -14 - Math.random()*12, w: Math.random()*6.28, life: 0}); }
        }
        z.bub = z.bub.filter(b => !b.dead).slice(-18);
        for(const f of z.fizz){
          f.life += dt; f.y += f.vy*dt; f.vy *= (1 - dt*.6); f.w += dt*7; f.x += Math.sin(f.w)*dt*6 - Tilt.a*dt*40;
          if(f.y < 4 || f.life > 1.6) f.a -= dt*3; if(f.y < top - 26) f.a -= dt*5;

  };

}
// ---------- Tilt: tilting or moving the phone makes every liquid lean and slosh a little ----------
// the resting angle slowly re-centres, so the liquid sways when the phone moves and settles back level
const Tilt = {
  a: 0, v: 0, target: 0, base: null, on: false, asked: false, t: 0, subs: [],
  // g: the phone's side-to-side tilt in radians; k: how upright it is (lying flat, the tilt means nothing)
  feed(g, k = 1){
    if(reduceMotion()){ this.target = 0; return; }
    if(this.base === null) this.base = g;
    this.base += (g - this.base)*.012;
    this.target = Math.max(-.16, Math.min(.16, (g - this.base)*.45*Math.min(1, k*2)));
  },
  // iPhone app: native Core Motion (no permission prompt, starts at launch); elsewhere: the web page's motion events
  boot(){
    const C = window.Capacitor, native = C && C.isNativePlatform && C.isNativePlatform() && C.getPlatform && C.getPlatform() === "ios";
    const cs = native ? plugin("CloudSync") : null;
    if(cs && cs.startMotion){

      cs.startMotion().then(r => {
        if(!r || !r.ok){ this.asked = false; return; }
        this.asked = true; this.native = true; this.run();
        cs.addListener("motion", d => this.feed(Math.atan2(d.gx, -d.gy), Math.hypot(d.gx, d.gy)));
        document.addEventListener("visibilitychange", () => { (document.hidden ? cs.stopMotion() : cs.startMotion()).catch(() => {}); });
      }).catch(() => { this.asked = false; });   // older app build without the native sensor: fall back to the web prompt
      return;
    }
    const D = window.DeviceOrientationEvent;
    if(D && typeof D.requestPermission !== "function") this.start();   // Android / web: no prompt needed
  },
  start(){
    if(this.on) return;
    window.addEventListener("deviceorientation", e => { if(e.gamma != null && !this.native) this.feed(e.gamma*Math.PI/180); });
    this.run();
  },
  run(){
    if(this.on) return; this.on = true;
    const tick = now => {
      const dt = Math.min(.05, this.t ? (now - this.t)/1000 : .016); this.t = now;
      const pa = this.a;

  },
  ask(){
    if(this.asked || this.native) return; this.asked = true;
    const D = window.DeviceOrientationEvent;

["touchend", "click"].forEach(ev => document.addEventListener(ev, () => Tilt.ask(), {once: true, capture: true}));

// ---------- Liquid progress bars: a sealed beaker on its side, filled with bubbly translucent blue ----------
const LBars = {
  list: [], raf: 0,
  scan(){
    document.querySelectorAll(".progress:not(.lb), .rbar:not(.lb)").forEach(el => {
      const i = el.querySelector("i"), pct = Math.max(0, Math.min(100, i ? parseFloat(i.style.width) || 0 : 0));
      el.classList.add("lb"); const cv = document.createElement("canvas"); cv.className = "lb-cv"; el.appendChild(cv);
      const rnd = rngFrom(Math.floor(pct*97) + this.list.length*131 + 7);
      this.list.push({el, cv, pct, shown: 0, w0: rnd()*6.28, dim: el.classList.contains("rbar") && !el.closest(".you"),
        bub: Array.from({length: 7}, () => ({x: rnd(), y: rnd(), r: .6 + rnd()*1.1, s: .25 + rnd()*.6, w: rnd()*6.28}))});
    });

  },
  frame(now){
    this.list = this.list.filter(b => b.el.isConnected);
    if(!this.list.length){ this.raf = 0; return; }
    const t = now/1000, dark = PAL.dark, calm = reduceMotion();
    for(const b of this.list){

      const ctx = b.cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
      const x0 = 1, x1 = W - 1, r = H/2 - 1, my = H/2;   // a sealed glass capsule, rounded at both ends
      const tube = inset => { ctx.beginPath(); ctx.arc(x0 + r, my, r - inset, Math.PI/2, Math.PI*1.5); ctx.arc(x1 - r, my, r - inset, -Math.PI/2, Math.PI/2); ctx.closePath(); };

        const g = ctx.createLinearGradient(0, 0, 0, H), al = b.dim ? .45 : 1;
        g.addColorStop(0, `rgba(140,205,255,${al})`); g.addColorStop(.35, `rgba(62,150,255,${al})`); g.addColorStop(.75, `rgba(24,110,230,${al})`); g.addColorStop(1, `rgba(12,78,178,${al})`);
        ctx.fillStyle = g; ctx.fill();
        const gl = ctx.createLinearGradient(0, 1, 0, H*.55); gl.addColorStop(0, `rgba(255,255,255,${.6*al})`); gl.addColorStop(1, "rgba(255,255,255,0)");

        ctx.fillStyle = `rgba(255,255,255,${.22*al})`; ctx.fillRect(x0 + r*.6, H - 4, Math.max(0, fx - x0 - r*1.2), 1.2);   // reflected light along the bottom
        if(!calm){ const gx = x0 + ((t*.22 + b.w0) % 1.6 - .3)*len, sg = ctx.createLinearGradient(gx - 14, 0, gx + 14, 0); sg.addColorStop(0, "rgba(255,255,255,0)"); sg.addColorStop(.5, `rgba(255,255,255,${.35*al})`); sg.addColorStop(1, "rgba(255,255,255,0)"); ctx.fillStyle = sg; ctx.fillRect(Math.max(x0, gx - 14), 0, Math.min(28, fx - (gx - 14)), H); }   // a glint that slides along

        }

      // glass outline and shine

    }

  }
};

    P.lastSeen = now;
    if(P.firstPaidAt && now > P.firstPaidAt + c.valueAfterDays*864e5 && (!P.valueAt || now > P.valueAt + c.valueEveryDays*864e5)) P.valueAt = now;

  weekend(){ const d = new Date().getDay(); return CONFIG.offerCfg.weekend && (d === 5 || d === 6 || d === 0); },
  pick(){

    if(P.valueAt && now < P.valueAt + c.valueHours*3600e3 && P.valueBoughtAt !== P.valueAt) return "value";

function tap(i){
  if(S.won || !R || S.speedOver) return;
  const s = S.shelves, v = R.vis[i];
  if(blocked(s, i)){ obNudge(i); return; }
  if(S.sel === null){
    // a playful wobble when you tap a beaker you can't pick up (empty, or full and corked)
    if(!s[i].length){ if(!reduceMotion()) v.wig = 1; sfx.squeak(); buzz(8); return; }
    if(isDone(s[i])){ sfx.squeak(); v.corkWig = 1; if(!reduceMotion()) v.wig = 1; buzz(10); return; }
    if(v.busy) settle(i);
    S.sel = i; sfx.pick(); buzz(); v.om += (Math.random() - .5)*4; labelHits(); return;
  }
  if(S.sel === i){ S.sel = null; labelHits(); return; }
  const from = S.sel;
  const info = moveInfo(s, from, i);
  if(info && !unlimitedMoves() && movesLeft() <= 0){ S.sel = null; labelHits(); outOfMoves(); return; }
  if(!info){
    if(s[i].length && !isDone(s[i])){ if(R.vis[i].busy) settle(i); S.sel = i; sfx.pick(); labelHits(); return; }
    sfx.bump(); buzz(20); v.shake = 1; return;
  }
  // bring both beakers' pictures up to date before this move starts
  settle(from); settle(i);
  const color = top(s[from]);
  S.history.push({shelves: clone(s), moves: S.moves, mixes: S.mixes});
  const mv = applyMove(s, from, i); revealTops(); if(mv && mv.ob) obEvents(mv.ob); if(!S.replaying){ S.log = (S.log || []).concat([[from, i]]).slice(-80); }
  S.moves++; S.sel = null;
  if(info.kind === "mix") S.mixes++;
  let completes = false;
  if(isDone(s[i])){
    completes = true;
    S.combo = (S.moves - S.lastDone <= 3) ? S.combo + 1 : 1;
    if(S.combo >= 2) S.comboN = (S.comboN || 0) + 1;
    S.lastDone = S.moves;
  }
  beginPour(from, i, info, color, completes, S.combo);
  if(isSolved(s)){ S.won = true; R.pendingWin = true; R.winAt = 0; }
  persistGame(); updateHud();
  if(!S.won && !unlimitedMoves() && movesLeft() <= 0) setTimeout(outOfMoves, 1100);
  else if(!S.won) checkDeadEnd();
}
function showCombo(n){ if(S.replaying) return; stBump("combos"); const d = document.createElement("div"); d.className = "combo"; d.textContent = `Combo ×${n}`; document.body.appendChild(d); setTimeout(() => d.remove(), 950); }
async function undo(){
  if(S.won || !S.history.length) return;
  LV.bump("undos");
  if(S.mode !== "speed" && undosLeft() <= 0){
    const ok = await showUpgrade("undo");
    updateHud();
    if(!ok || S.screen !== "game") return;
  }
  const h = S.history.pop(); if(!h) return;
  if(!Store.hasBundle() && S.mode !== "speed") S.undosUsed = (S.undosUsed || 0) + 1;
  settleAll();
  S.shelves = h.shelves; S.moves = h.moves; S.mixes = h.mixes || 0; S.sel = null; S.combo = 0;
  R.vis.forEach((v, i) => { syncVis(i); if(!isDone(S.shelves[i])) v.cork = null; });
  sfx.undo(); persistGame(); updateHud();
}
function restart(){
