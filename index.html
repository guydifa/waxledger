<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wax Ledger — A Yankee Candle Accessory Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wax: #FAF4E9;
    --wax-card: #F3EAD9;
    --wick: #2B241C;
    --wick-soft: #5C5346;
    --flame: #B9762E;
    --flame-deep: #8F5A20;
    --glass: #445A45;
    --plum: #7A5C6E;
    --sky: #3D6E8C;
    --dot-green: #2FAE59;
    --dot-blue: #2F86EB;
    --dot-amber: #F0A020;
    --line: #E0D3BB;
    --line-strong: #C9B896;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--wax);
    color:var(--wick);
    font-family:'Public Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{
    font-family:'Fraunces', serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }

  /* ---------- App ---------- */
  header.top{
    position:sticky; top:0; z-index:10;
    background:#5C4326;
    border-bottom:1px solid #4A3620;
    padding:22px 28px 16px;
    position:relative;
    overflow:hidden;
  }
  .header-body{ position:relative; }
  .header-left{ }
  .header-right{
    position:absolute;
    top:0; right:0; bottom:0;
    display:flex; flex-direction:column; justify-content:space-between; align-items:flex-end;
    text-align:right;
  }
  .header-stamp{
    display:none;
    position:absolute;
    top:8px; bottom:8px; right:40%;
    aspect-ratio:1/1;
    transform:rotate(-9deg);
    align-items:center; justify-content:center;
    opacity:0.55;
    pointer-events:none;
    z-index:0;
  }
  .header-stamp img{ width:100%; height:100%; }
  @media (min-width:1024px) and (hover:hover) and (pointer:fine){
    .header-stamp{ display:flex; }
  }
  .brand{ display:block; }
  .brand h1{ font-size:1.6rem; margin:0; color:#F7F1E3; }
  .header-right .count{ color:#E4D9C4; font-size:0.9rem; }
  .version-link{
    background:none; border:none; padding:0; margin:0;
    font-family:'Public Sans', sans-serif; font-size:0.72rem;
    color:#C9A15C; cursor:pointer;
    text-decoration:underline dotted; text-underline-offset:2px;
  }
  .version-link:hover{ color:#F7F1E3; }
  .stats-row{
    display:flex; align-items:baseline; gap:22px; margin-top:10px; flex-wrap:wrap;
  }
  .stat{ display:flex; align-items:baseline; gap:6px; }
  .stat .num{ font-family:'Fraunces', serif; font-weight:600; font-size:1.3rem; color:#F7F1E3; }
  .stat .label{ font-size:0.78rem; color:#D8CBB0; }

  .controls{
    display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; align-items:center;
    padding-right:260px;
  }
  #search{
    flex:1 1 220px; max-width:340px;
    padding:10px 14px;
    border:1px solid var(--line-strong); border-radius:2px;
    font-family:'Public Sans', sans-serif; font-size:0.95rem;
    background:#fff; color:var(--wick);
  }
  #search:focus{ outline:2px solid var(--flame); outline-offset:1px; }

  .filter-chips{ display:contents; }
  .chip{
    padding:8px 14px;
    border:1px solid var(--line-strong);
    border-radius:2px;
    background:#FDFDFC;
    font-family:'Public Sans', sans-serif; font-size:0.85rem;
    color:var(--wick-soft);
    cursor:pointer;
    transition:all 0.15s ease;
    white-space:nowrap;
  }
  .chip:hover{ border-color:var(--flame); color:var(--wick); }
  .chip.active{ background:var(--wick); border-color:var(--wick); color:var(--wax); }
  .filter-select{
    display:none;
    flex:1 1 220px; max-width:340px;
    padding:10px 14px;
    border:1px solid var(--line-strong); border-radius:2px;
    font-family:'Public Sans', sans-serif; font-size:0.95rem;
    background:#FDFDFC; color:var(--wick);
  }
  .filter-select:focus{ outline:2px solid var(--flame); outline-offset:1px; }
  @media (max-width:760px){
    .filter-chips{ display:none; }
    .filter-select{ display:block; width:100%; max-width:none; }
  }

  main{ padding:24px 28px 60px; }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:20px;
  }
  .card{
    background:var(--wax-card);
    border:1px solid var(--line);
    border-radius:2px;
    overflow:hidden;
    display:flex; flex-direction:column;
    cursor:pointer;
    transition:border-color 0.15s ease;
  }
  .card:hover{ border-color:var(--flame); }
  .card:focus-visible{ outline:2px solid var(--flame); outline-offset:2px; }
  .thumb{
    aspect-ratio:1/1;
    background:#fff;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    border-bottom:1px solid var(--line);
  }
  .thumb img{ width:100%; height:100%; object-fit:cover; }
  .thumb.empty{ background:#9A9A9A; color:#F0EAE0; font-size:0.75rem; font-family:'Public Sans'; }
  .thumb.quad{
    display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:1px;
    background:var(--line);
  }
  .thumb.quad img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb.quad .quad-empty{ background:#FFFFFF; }
  .card-body{ padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px; flex:1; background:#FDFDFC; }
  .card-body h3{ font-size:1.05rem; margin:0; line-height:1.25; }
  .pieces{ margin-top:auto; padding-top:8px; display:flex; gap:6px; }
  .piece-icon{ display:inline-flex; cursor:help; }
  .piece-icon svg{ width:30px; height:30px; background:var(--wax-card); border:1px solid var(--line); border-radius:7px; padding:3px; box-sizing:border-box; }
  .meta-row{ display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:0.82rem; color:var(--wick-soft); }
  .status-bar{
    padding:5px 16px;
    font-size:0.78rem; font-weight:700;
    color:#fff;
    text-align:center;
  }
  .status-bar.owned{ background:var(--dot-green); }
  .status-bar.awaiting{ background:var(--dot-blue); }
  .status-bar.looking, .status-bar.verify, .status-bar.no{ background:var(--dot-amber); }
  .status{
    display:inline-flex; align-items:center; gap:6px;
    font-size:0.78rem; font-weight:600;
  }
  .status.owned{ color:var(--dot-green); }
  .status.awaiting{ color:var(--dot-blue); }
  .status.looking, .status.verify, .status.no{ color:var(--dot-amber); }
  .dot{ width:10px; height:10px; border-radius:50%; flex:none; box-shadow:0 0 0 1px rgba(0,0,0,0.08); }
  .dot.owned{ background:var(--dot-green); }
  .dot.awaiting{ background:var(--dot-blue); }
  .dot.looking{ background:var(--dot-amber); }
  .dot.verify{ background:var(--dot-amber); }
  .dot.no{ background:var(--dot-amber); }
  .sku{ font-size:0.75rem; color:var(--wick-soft); }
  .notes{ font-size:0.78rem; color:var(--wick-soft); font-style:italic; margin-top:2px; }

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--wick-soft);
  }
  .empty-state h2{ font-size:1.2rem; margin-bottom:8px; }

  footer{
    text-align:center; padding:24px; color:var(--wick-soft); font-size:0.78rem;
    border-top:1px solid var(--line);
  }

  @media (max-width:520px){
    header.top{ padding:18px 16px 14px; }
    main{ padding:18px 16px 40px; }
    .grid{ grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:14px; }
    .thumb.quad{ display:block; }
    .thumb.quad img, .thumb.quad .quad-empty{ display:none; }
    .thumb.quad img:first-child, .thumb.quad .quad-empty:first-child{
      display:block; width:100%; height:100%; object-fit:cover;
    }
  }

  /* ---------- Detail modal ---------- */
  #modalOverlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(43,36,28,0.55);
    z-index:200;
    align-items:flex-start; justify-content:center;
    overflow-y:auto;
    padding:40px 20px;
  }
  #modalOverlay.open{ display:flex; }
  .modal{
    background:var(--wax);
    max-width:760px; width:100%;
    border-radius:2px;
    box-shadow:0 30px 70px rgba(0,0,0,0.4);
    overflow:hidden;
  }
  .modal-top{
    display:flex; gap:0;
    flex-wrap:wrap;
  }
  .modal-photo{
    flex:1 1 300px;
    background:#fff;
    display:flex; align-items:center; justify-content:center;
    min-height:280px;
    border-bottom:1px solid var(--line);
  }
  .modal-photo img{ width:100%; height:100%; object-fit:contain; max-height:420px; cursor:zoom-in; }
  .modal-photo.empty{ color:var(--line-strong); font-size:0.85rem; }

  #lightbox{
    display:none;
    position:fixed; inset:0;
    background:rgba(20,16,12,0.92);
    z-index:300;
    align-items:center; justify-content:center;
    padding:30px;
    cursor:zoom-out;
  }
  #lightbox.open{ display:flex; }
  #lightbox img{ max-width:100%; max-height:100%; object-fit:contain; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
  #lightbox .lightbox-close{
    position:absolute; top:20px; right:28px;
    background:none; border:none; color:#fff; font-size:2rem;
    cursor:pointer; line-height:1;
  }
  .lightbox-strip{
    position:absolute; bottom:24px; left:0; right:0;
    display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:0 20px;
  }
  .lightbox-strip img{
    width:56px; height:56px; object-fit:cover; border-radius:2px; cursor:pointer;
    border:2px solid transparent; opacity:0.6;
    max-height:56px;
  }
  .lightbox-strip img.active{ border-color:#fff; opacity:1; }

  /* ---------- Piece navigation within a collection ---------- */
  .piece-nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 28px 0;
  }
  .piece-nav button{
    background:none; border:1px solid var(--line-strong); border-radius:2px;
    padding:6px 12px; font-family:'Public Sans'; font-size:0.85rem; color:var(--wick);
    cursor:pointer;
  }
  .piece-nav button:disabled{ opacity:0.3; cursor:default; }
  .piece-nav button:not(:disabled):hover{ border-color:var(--flame); }
  .piece-nav .piece-count{ font-size:0.8rem; color:var(--wick-soft); }
  .modal-head{
    flex:1 1 300px;
    padding:28px 28px 20px;
  }
  .modal-head h2{ font-size:1.5rem; margin:0 0 4px; }
  .modal-head .unofficial{ font-size:0.8rem; color:var(--wick-soft); font-weight:400; }
  .modal-head .sub{ color:var(--wick-soft); font-size:0.92rem; margin-bottom:14px; }
  .modal-close{
    position:absolute; top:16px; right:20px;
    background:none; border:none; font-size:1.4rem; color:var(--wick-soft);
    cursor:pointer; line-height:1; padding:4px 8px;
  }
  .modal-close:hover{ color:var(--wick); }
  .modal-body{ padding:8px 28px 28px; position:relative; }
  .detail-section{ margin-top:18px; }
  .detail-section h4{
    font-family:'Public Sans', sans-serif; font-size:0.78rem; font-weight:700;
    color:var(--wick-soft); margin:0 0 10px; letter-spacing:0.02em;
    border-bottom:1px solid var(--line); padding-bottom:6px;
  }
  .detail-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr));
    gap:10px 20px;
  }
  .detail-item .label{ font-size:0.72rem; color:var(--wick-soft); margin-bottom:2px; }
  .detail-item .value{ font-size:0.92rem; color:var(--wick); }
  .detail-item .value a{ color:var(--flame-deep); }
  .detail-item .value.empty{ color:var(--line-strong); }
  .modal-notes{ font-size:0.88rem; font-style:italic; color:var(--wick-soft); margin-top:16px; }
  .store-logo{ height:18px; max-width:150px; object-fit:contain; vertical-align:middle; border-radius:3px; }

  /* ---------- Changelog ---------- */
  #changelogOverlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(43,36,28,0.55);
    z-index:200;
    align-items:flex-start; justify-content:center;
    overflow-y:auto;
    padding:40px 20px;
  }
  #changelogOverlay.open{ display:flex; }
  .changelog-modal{
    background:var(--wax);
    max-width:520px; width:100%;
    border-radius:2px;
    box-shadow:0 30px 70px rgba(0,0,0,0.4);
    padding:28px 28px 24px;
    position:relative;
  }
  .changelog-modal h3{ margin:0 0 18px; padding-right:24px; }
  .changelog-entry{ margin-bottom:18px; padding-bottom:18px; border-bottom:1px solid var(--line); }
  .changelog-entry:last-of-type{ border-bottom:none; margin-bottom:0; padding-bottom:0; }
  .changelog-version{ font-family:'Fraunces', serif; font-weight:600; font-size:1.02rem; color:var(--wick); }
  .changelog-date{ font-size:0.78rem; color:var(--wick-soft); margin:2px 0 8px; }
  .changelog-entry ul{ margin:0; padding-left:18px; }
  .changelog-entry li{ font-size:0.88rem; color:var(--wick); margin-bottom:4px; }
  .changelog-footnote{ font-size:0.78rem; color:var(--wick-soft); font-style:italic; margin-top:16px; }
</style>
</head>
<body>

let currentFilter = 'Yes';
function setFilter(f, el){
  currentFilter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  const btn = el || document.querySelector(`.chip[data-filter="${f}"]`);
  if(btn) btn.classList.add('active');
  const sel = document.getElementById('filterSelect');
  if(sel) sel.value = f;
  render();
}

// Pieces in the site's usual order: shade, plate, warmers, Illuma-Lid, then the rest; larger sizes first.
function piecesInOrder(pieces){
  // Same order as the admin site: large shade, large plate, 3D, tart warmers, medium/small shades and plates, then the rest.
  const ORDER = [
    p => p.itemType === 'Jar Shade' && p.size === 'Large',
    p => /Plate/.test(p.itemType) && p.size === 'Large',
    p => /3D/.test(p.itemType),
    p => /Tart Warmer \(Candle\)/.test(p.itemType),
    p => /Tart Warmer/.test(p.itemType),
    p => p.itemType === 'Jar Shade' && p.size === 'Medium',
    p => /Plate/.test(p.itemType) && p.size === 'Medium',
    p => p.itemType === 'Jar Shade',
    p => /Plate/.test(p.itemType),
    p => /Votive/.test(p.itemType),
    p => /Tea ?Light/i.test(p.itemType),
    p => /Holder/.test(p.itemType),
    p => /Illuma/.test(p.itemType)
  ];
  const rank = p => { const k = ORDER.findIndex(f => f(p)); return k < 0 ? ORDER.length : k; };
  const owned = p => p.owned === 'Yes' || p.owned === 'Awaiting Delivery';
  return [...pieces].sort((a, b) => (owned(b) - owned(a)) || (rank(a) - rank(b)));
}

// Zoom each small icon's drawing to fill its square so it's readable at card size.
function fitIcons(root){
  root.querySelectorAll('.piece-icon svg').forEach(svg => {
    try {
      if(svg.dataset.fit){ svg.setAttribute('viewBox', svg.dataset.fit); return; }
      const b = svg.getBBox();
      if(!b.width || !b.height) return;
      const side = Math.max(b.width, b.height) * 1.1;
      svg.setAttribute('viewBox', `${b.x + b.width / 2 - side / 2} ${b.y + b.height / 2 - side / 2} ${side} ${side}`);
    } catch(e) { /* not rendered yet */ }
  });
}

function statusDot(owned){
  if(owned === 'Yes') return 'owned';
  if(owned === 'Awaiting Delivery') return 'awaiting';
  return 'no'; // Looking, Maybe (Verify), Available, Unknown, etc. — all "other"
}

function statusLabel(owned){
  if(owned === 'Yes') return 'Owned';
  return owned || 'Unknown';
}

function buildCollections(items){
  const map = new Map();
  items.forEach(i => {
    if(!map.has(i.name)) map.set(i.name, []);
    map.get(i.name).push(i);
  });
  return Array.from(map.entries()).map(([name, pieces]) => ({ name, pieces }));
}

let currentCollections = [];
let openCollectionIdx = null;
let openPieceIdx = 0;
let currentGalleryImages = [];
let currentGalleryIdx = 0;

function isCompleteSet(pieces){
  const types = new Set(pieces.map(p => p.itemType));
  return types.has('Jar Shade') && types.has('Jar Candle Tray (Plate)');
}

function parseDate(d){
  if(!d) return null;
  const t = Date.parse(d);
  return isNaN(t) ? null : t;
}

function latestAcquiredDate(pieces){
  const dates = pieces.map(p => parseDate(p.dateAquired)).filter(d => d !== null);
  return dates.length ? Math.max(...dates) : -Infinity;
}

function hasAnyImage(pieces){
  return pieces.some(p => p.images && p.images.length > 0);
}

function isOwnedLargeSet(pieces){
  return pieces.some(p => p.itemType === 'Jar Shade' && p.size === 'Large' && p.owned === 'Yes')
    && pieces.some(p => p.itemType === 'Jar Candle Tray (Plate)' && p.size === 'Large' && p.owned === 'Yes');
}

// Sets stay together; sets with something owned first, newest first (date added, then date acquired).
// Pieces within a set follow the type order below, not-owned pieces last.
const TYPE_ORDER = [
  p => p.itemType === 'Jar Shade' && p.size === 'Large',
  p => /Plate/.test(p.itemType) && p.size === 'Large',
  p => /3D/.test(p.itemType),
  p => /Tart Warmer \(Candle\)/.test(p.itemType),
  p => /Tart Warmer/.test(p.itemType),
  p => p.itemType === 'Jar Shade' && p.size === 'Medium',
  p => /Plate/.test(p.itemType) && p.size === 'Medium',
  p => p.itemType === 'Jar Shade',
  p => /Plate/.test(p.itemType),
  p => /Votive/.test(p.itemType),
  p => /Tea ?Light/i.test(p.itemType),
  p => /Holder/.test(p.itemType),
  p => /Illuma/.test(p.itemType)
];
const isOwnedPiece = p => p.owned === 'Yes' || p.owned === 'Awaiting Delivery';   // on its way = owned
const typeRank = p => { const k = TYPE_ORDER.findIndex(f => f(p)); return k < 0 ? TYPE_ORDER.length : k; };
function sortCollectionsDefault(collections){
  const t = v => { const n = Date.parse(v); return isNaN(n) ? 0 : n; };
  const key = c => ({ owned: c.pieces.some(isOwnedPiece) ? 1 : 0,
    added: Math.max(0, ...c.pieces.map(p => t(p.addedAt))), acquired: Math.max(0, ...c.pieces.map(p => t(p.dateAquired))) });
  collections.forEach(c => c.pieces.sort((a, b) => (isOwnedPiece(b) - isOwnedPiece(a)) || (typeRank(a) - typeRank(b))));
  return [...collections].map(c => ({ c, k: key(c) }))
    .sort((a, b) => (b.k.owned - a.k.owned) || (b.k.added - a.k.added) || (b.k.acquired - a.k.acquired)).map(x => x.c);
}

function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  let items = CATALOG_DATA.filter(i => {
    if(currentFilter !== 'all' && currentFilter !== 'sets' && i.owned !== currentFilter) return false;
    if(q){
      const hay = [i.name, i.itemType, i.sku, i.notes].filter(Boolean).join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  let collections = buildCollections(items);

  if(currentFilter === 'sets'){
    collections = collections.filter(c => isCompleteSet(c.pieces));
  }

  collections = sortCollectionsDefault(collections);
  currentCollections = collections;

  const totalPieces = collections.reduce((sum, c) => sum + c.pieces.length, 0);
  document.getElementById('itemCount').textContent =
    collections.length + ' set' + (collections.length === 1 ? '' : 's') +
    ' · ' + totalPieces + ' piece' + (totalPieces === 1 ? '' : 's');

  renderStats(items, collections);

  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  if(collections.length === 0){
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = collections.map((c, cidx) => {
    const PREVIEW_PRIORITY = {
      'Jar Shade': 0,
      'Jar Candle Tray (Plate)': 1,
      'Tart Warmer (Candle)': 2,
      'Tart Warmer (Electric)': 2,
      'Illuma-Lid Topper': 3,
    };
    const piecesWithImages = c.pieces.filter(p => p.images && p.images[0]);
    const previewOrder = [...piecesWithImages].sort((a, b) => {
      const pa = PREVIEW_PRIORITY[a.itemType] ?? 99;
      const pb = PREVIEW_PRIORITY[b.itemType] ?? 99;
      return pa - pb;
    });
    const thumbs = previewOrder.map(p => p.images[0].thumb).slice(0,4);
    const thumbPieceIdx = previewOrder.map(p => c.pieces.indexOf(p)).slice(0,4);
    let thumbHtml;
    if(thumbs.length === 0){
      thumbHtml = `<div class="thumb empty">No photo yet</div>`;
    } else if(thumbs.length === 1){
      thumbHtml = `<div class="thumb"><img src="${imgSrc(thumbs[0])}" alt="${c.name}" loading="lazy" onclick="event.stopPropagation(); openCollection(${cidx}, ${thumbPieceIdx[0]})"></div>`;
    } else {
      const cells = [0,1,2,3].map(n => thumbs[n]
        ? `<img src="${imgSrc(thumbs[n])}" alt="${c.name}" loading="lazy" onclick="event.stopPropagation(); openCollection(${cidx}, ${thumbPieceIdx[n]})">`
        : `<div class="quad-empty"></div>`
      ).join('');
      thumbHtml = `<div class="thumb quad">${cells}</div>`;
    }

    const owned = c.pieces.every(p => p.owned === 'Yes') ? 'Yes'
      : c.pieces.some(p => p.owned === 'Yes') ? 'Mixed'
      : c.pieces[0].owned;
    const ownedLabel = owned === 'Mixed' ? 'Partially owned' : statusLabel(owned);
    const ownedDot = owned === 'Mixed' ? 'awaiting' : statusDot(owned);

    return `
    <div class="card" tabindex="0" onclick="openCollection(${cidx})" onkeydown="if(event.key==='Enter') openCollection(${cidx})">
      ${thumbHtml}
      <div class="card-body">
        <h3 class="serif">${c.name}${yearSuffix(c.pieces[0].mfrDate)}</h3>
        <div class="meta-row"><span>${c.pieces.length} piece${c.pieces.length===1?'':'s'}</span></div>
        <div class="meta-row">
          <span class="status ${ownedDot}"><span class="dot ${ownedDot}"></span>${ownedLabel}</span>
        </div>
        <div class="pieces">${piecesInOrder(c.pieces).slice(0, 5).map(p => {
          const what = [p.itemType || 'Other', p.size].filter(Boolean).join(' · ');
          return `<span class="piece-icon" title="${what}" aria-label="${what}">${typeIcon(p.itemType, p.size)}</span>`;
        }).join('')}</div>
      </div>
    </div>
  `;
  }).join('');
  fitIcons(grid);
}

function yearSuffix(mfrDate){
  if(!mfrDate) return '';
  const match = String(mfrDate).match(/\b(19|20)\d{2}\b/);
  return match ? ` (${match[0]})` : '';
}

function fieldRow(label, value){
  const empty = (value === null || value === undefined || value === '');
  const display = empty ? '—' : value;
  return `<div class="detail-item"><div class="label">${label}</div><div class="value${empty ? ' empty' : ''}">${display}</div></div>`;
}

function storeRow(store){
  const empty = (store === null || store === undefined || store === '');
  if(empty){
    return `<div class="detail-item"><div class="label">Store</div><div class="value empty">—</div></div>`;
  }
  const logo = STORE_LOGOS[String(store).toLowerCase()];
  const value = logo
    ? `<img src="${logo}" alt="${store}" class="store-logo">`
    : store;
  return `<div class="detail-item"><div class="label">Store</div><div class="value">${value}</div></div>`;
}

function money(v){
  if(v === null || v === undefined) return null;
  return '$' + Number(v).toFixed(2);
}

function openCollection(cidx, pieceIdx){
  openCollectionIdx = cidx;
  openPieceIdx = pieceIdx || 0;
  renderPiece();
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function stepPiece(delta){
  const coll = currentCollections[openCollectionIdx];
  if(!coll) return;
  const next = openPieceIdx + delta;
  if(next < 0 || next >= coll.pieces.length) return;
  openPieceIdx = next;
  renderPiece();
}

function renderPiece(){
  const coll = currentCollections[openCollectionIdx];
  if(!coll) return;
  const i = coll.pieces[openPieceIdx];
  const images = i.images || [];

  document.getElementById('pieceNav').innerHTML = coll.pieces.length > 1 ? `
    <button onclick="stepPiece(-1)" ${openPieceIdx===0?'disabled':''}>&larr; Previous</button>
    <span class="piece-count">${openPieceIdx+1} of ${coll.pieces.length} — ${coll.name}</span>
    <button onclick="stepPiece(1)" ${openPieceIdx===coll.pieces.length-1?'disabled':''}>Next &rarr;</button>
  ` : `<span class="piece-count">${coll.name}</span>`;

  document.getElementById('modalPhoto').innerHTML = images.length
    ? `<img src="${imgSrc(images[0].large)}" alt="${i.name}" onclick="openGallery()">`
    : `<div class="modal-photo empty">No photo yet</div>`;
  document.getElementById('modalPhoto').className = 'modal-photo' + (images.length ? '' : ' empty');

  document.getElementById('modalHead').innerHTML = `
    <h2 class="serif">${i.name}${yearSuffix(i.mfrDate)}</h2>
    <div class="sub"><span class="status ${i.officialName === 'No' ? 'no' : 'owned'}"><span class="dot ${i.officialName === 'No' ? 'no' : 'owned'}"></span>${i.officialName === 'No' ? 'Unofficial name' : 'Official name'}</span></div>
    <div class="sub">${[i.itemType, i.size].filter(Boolean).join(' · ')}</div>
    <span class="status ${statusDot(i.owned)}"><span class="dot ${statusDot(i.owned)}"></span>${statusLabel(i.owned)}</span>
  `;

  const dims = [i.length, i.width, i.height].filter(v => v !== null && v !== undefined);
  const dimStr = dims.length ? dims.join('" × ') + '"' : null;

  document.getElementById('modalBody').innerHTML = `
    ${i.description ? `<div class="detail-section" style="margin-top:0;">
      <h4>Description</h4>
      <div class="modal-notes" style="margin-top:0;font-style:normal;">${i.description}</div>
    </div>` : ''}

    <div class="detail-section">
      <h4>Identification</h4>
      <div class="detail-grid">
        ${fieldRow('SKU', i.sku)}
        ${fieldRow('UPC', i.upc)}
        ${fieldRow('Season', i.season)}
        ${fieldRow('Official name', i.officialName)}
        ${fieldRow('MFR date', i.mfrDate)}
        ${fieldRow('MFR price', money(i.mfrPrice))}
        ${fieldRow('Online exclusive', i.onlineExclusive)}
        ${fieldRow('Dimensions', dimStr)}
      </div>
    </div>

    <div class="detail-section">
      <h4>Ownership &amp; purchase</h4>
      <div class="detail-grid">
        ${fieldRow('Status', i.owned)}
        ${fieldRow('Date acquired', i.dateAquired)}
        ${fieldRow('Total price', money(i.purchasePrice))}
        ${storeRow(i.store)}
        ${fieldRow('Quantity', i.qty)}
        ${fieldRow('Store location', i.location)}
        ${fieldRow('Complete listing', i.completeListing)}
        ${fieldRow('Seller', i.seller)}
        ${i.url ? `<div class="detail-item"><div class="label">Listing</div><div class="value"><a href="${i.url}" target="_blank" rel="noopener">View listing</a></div></div>` : ''}
      </div>
    </div>

    ${i.notes ? `<div class="modal-notes">${i.notes}</div>` : ''}
  `;
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function openGallery(){
  const coll = currentCollections[openCollectionIdx];
  const i = coll.pieces[openPieceIdx];
  currentGalleryImages = (i.images || []).map(im => im.large);
  currentGalleryIdx = 0;
  renderGallery();
  document.getElementById('lightbox').classList.add('open');
}

function renderGallery(){
  document.getElementById('lightboxImg').src = imgSrc(currentGalleryImages[currentGalleryIdx]);
  const strip = document.getElementById('lightboxStrip');
  if(currentGalleryImages.length > 1){
    strip.innerHTML = currentGalleryImages.map((img, idx) => `
      <img src="${imgSrc(img)}" class="${idx===currentGalleryIdx?'active':''}"
           onclick="event.stopPropagation(); currentGalleryIdx=${idx}; renderGallery();">
    `).join('');
  } else {
    strip.innerHTML = '';
  }
}

function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
}

function renderChangelog(){
  document.getElementById('changelogBody').innerHTML = CHANGELOG.map(entry => `

      <div class="changelog-version">${entry.version}</div>
      <div class="changelog-date">${entry.date}</div>
      <ul>${entry.changes.map(c => `<li>${c}</li>`).join('')}</ul>
    </div>
  `).join('') + `<div class="changelog-footnote">Version history was introduced in ${CHANGELOG[CHANGELOG.length - 1].version}; earlier revisions were not individually logged.</div>`;
}

function openChangelog(){
  renderChangelog();
  document.getElementById('changelogOverlay').classList.add('open');
}

function closeChangelog(){
  document.getElementById('changelogOverlay').classList.remove('open');
}

document.addEventListener('keydown', e => {
  const lightboxOpen = document.getElementById('lightbox').classList.contains('open');
  const modalOpen = document.getElementById('modalOverlay').classList.contains('open');
  const changelogOpen = document.getElementById('changelogOverlay').classList.contains('open');
  if(e.key === 'Escape'){
    if(lightboxOpen) closeLightbox();
    else if(modalOpen) closeModal();
    else if(changelogOpen) closeChangelog();
  } else if(e.key === 'ArrowLeft'){
    if(lightboxOpen && currentGalleryImages.length > 1){
      currentGalleryIdx = Math.max(0, currentGalleryIdx - 1); renderGallery();
    } else if(modalOpen){
      stepPiece(-1);
    }
  } else if(e.key === 'ArrowRight'){
    if(lightboxOpen && currentGalleryImages.length > 1){
      currentGalleryIdx = Math.min(currentGalleryImages.length - 1, currentGalleryIdx + 1); renderGallery();
    } else if(modalOpen){
      stepPiece(1);
    }
  }
});

function renderStats(items, collections){
  const dataset = items || CATALOG_DATA;
  const groups = new Map();
  dataset.forEach(i => {
    if(!groups.has(i.name)) groups.set(i.name, new Set());
    groups.get(i.name).add(i.itemType + '|' + i.size);
  });
  const totalItems = dataset.length;
  const totalThemes = groups.size;
  let totalSets = 0;
  groups.forEach(typeSizes => {
    if(typeSizes.has('Jar Shade|Large') && typeSizes.has('Jar Candle Tray (Plate)|Large')) totalSets++;
  });

  document.getElementById('statsRow').innerHTML = `
    <div class="stat"><span class="num">${totalItems}</span><span class="label">Pieces</span></div>
    <div class="stat"><span class="num">${totalSets}</span><span class="label">Large Shade + Plate Sets</span></div>
    <div class="stat"><span class="num">${totalThemes}</span><span class="label">Themes / Lines</span></div>
  `;
  document.getElementById('versionLink').textContent = `${CURRENT_VERSION} · Updated ${UPDATED_AT}`;
}

render();
